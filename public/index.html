<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagano LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Eagano dash language (CLAUDE.md) + one soft pastel per department (docs/specs/dashboard.md). */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --panel:#131316; --panel2:#17171b; --border:#26262b; --soft:#1d1d22;
  --text:#e8e8ea; --muted:#8a8a93; --faint:#54545c; --dim:#b9b9c0;
  --accent:#b9d3ff; --good:#6fe3b4; --warn:#ffd36e; --bad:#ff8fab; --blue:#7cc4ff; --peach:#ffb38a;
  --gap:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button{font-family:var(--font)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font:600 15px var(--font);padding:0 10px}
.brand-sub{font-size:11px;color:var(--faint);padding:2px 10px 18px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px}
.nav a:hover{color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);font-weight:500}
.nav .n{font-size:11px;color:var(--bad);margin-left:6px}
.side-foot{margin-top:auto;font-size:11px;color:var(--faint);padding:0 10px;display:grid;gap:3px}
.main{padding:20px 24px 40px;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:4px;border-right:0;border-bottom:1px solid var(--border)}
  .brand-sub,.side-foot{display:none}
  .brand{padding-right:10px}
  .nav{display:flex;gap:2px}
  .main{padding:14px 16px 32px}
}
#page{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font:500 12px var(--font);background:none;cursor:pointer;white-space:nowrap}
.pill.on{border-color:var(--accent);color:var(--text)}
.pill.dash{border-style:dashed;color:var(--faint);cursor:default}
.status{font-size:12px;color:var(--faint)}
.status .ok{color:var(--good)}.status .bad{color:var(--bad)}.status a.bad:hover{text-decoration:underline}
.lab{font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.box{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.kpi{border:1px solid var(--border);border-radius:12px;background:linear-gradient(180deg,#16161b,#121215);padding:14px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.kpi .l{font-size:11px;color:var(--faint)}
.kpi .v{font:600 24px var(--font);margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:1px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:var(--gap);align-items:start}
@media (max-width:1100px){.home{grid-template-columns:minmax(0,1fr)}}
.mapbox{border:1px solid var(--border);border-radius:12px;background:radial-gradient(ellipse at 50% 48%,#15171f 0%,#0d0d10 62%);position:relative;overflow-x:auto;display:flex;flex-direction:column}
/* The map keeps its own height; the side column scrolls instead of stretching it
   (a tall activity list once pushed the drawing out of view). */
.home{align-items:stretch!important}
.mapbox{display:flex;flex-direction:column}
.mapbox .legend{margin-top:auto}
.homeside{min-height:0}
.homeside .feedbox{position:relative;flex:1 1 0;min-height:240px;padding:0;overflow:hidden}
.homeside .feedbox .inner{position:absolute;inset:0;overflow:auto;padding:16px}
#map{display:block;width:100%;min-width:760px;height:auto}
#map .lb{font:400 11px var(--font);fill:#80808b}
#map .lb.off{fill:#54545c;text-decoration:line-through}
#map .sys{font:500 11px var(--font);fill:#a3a3ae}
#map .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#map .spin{animation:none}}
#map .lb.on{fill:var(--text);font-weight:500}
#map .hub{font:600 12.5px var(--font);fill:var(--text)}
#map .sub{font:400 9px var(--font);fill:var(--faint)}
#map .node{cursor:pointer}
#map .node:hover .lb{fill:var(--text)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11px;color:var(--faint);padding:12px 16px;border-top:1px solid var(--border)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.card{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--panel2)}
.card .t{font:500 13px var(--font);display:flex;justify-content:space-between;gap:8px}
.card .t span{font:400 11px var(--font);color:var(--faint);white-space:nowrap}
.card .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.card .sum{font-size:13px;color:var(--text);margin-top:6px;line-height:1.45}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.card .meta .tag{margin-left:0}
.card .meta,.card .meta span:not(.tag){font:400 11.5px var(--font);letter-spacing:0}
.card details{margin-top:6px;font-size:12px;color:var(--muted)}
.card details summary{cursor:pointer;color:var(--faint);font-size:11px;list-style:none}
.card details summary::-webkit-details-marker{display:none}
.card details[open] summary{margin-bottom:4px}
.feed .r{display:grid;grid-template-columns:40px 26px minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--soft);font-size:12px;color:var(--muted)}
.feed .r .tm{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.feed .r b{color:var(--text);font-weight:500}
.feed .r.alarm{color:var(--bad)}
.feed .r.fresh b::after{content:" · now";color:var(--good);font-weight:400;font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--faint)}
.av{width:26px;height:26px;border-radius:50%;border:1px solid;display:grid;place-items:center;font:600 9.5px var(--font);letter-spacing:.02em}
.av.on{box-shadow:0 0 0 3px rgba(111,227,180,.18),0 0 12px rgba(111,227,180,.35)}
.spk{display:block;width:100%;height:42px;margin-top:auto;padding-top:12px}
.bars{display:block;width:100%;height:auto;margin-top:auto;padding-top:10px}
.glow{position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;opacity:.16;pointer-events:none;-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent)}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
@media (max-width:900px){.stores{grid-template-columns:minmax(0,1fr)}}
.sc{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;position:relative;overflow:hidden}
.sc .n{font:600 13.5px var(--font)}.sc .m{font-size:11.5px;color:var(--muted)}
.ring{width:58px;height:58px}
.chart{width:100%;height:auto;display:block}
.chart text{font:400 10px var(--font);fill:#6f6f78}
@keyframes blink{50%{opacity:.25}}
.live{animation:blink 1.4s infinite}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}
.btn{background:none;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font:500 12.5px var(--font);cursor:pointer}
.btn.p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.g{background:var(--good);color:var(--bg);border-color:var(--good)}
.btn.no{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg{white-space:pre-wrap;font:12px var(--mono);color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px}
.note{font-size:11.5px;color:var(--faint);margin-top:6px}
.ok-t,.tbl td.ok-t,.kv b.ok-t{color:var(--good)}.bad-t,.tbl td.bad-t,.kv b.bad-t{color:var(--bad)}.warn-t,.tbl td.warn-t,.kv b.warn-t{color:var(--warn)}
/* P&L */
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
@media (max-width:1000px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blk{border:1px solid var(--border);border-radius:12px;background:linear-gradient(180deg,#16161b,#121215);padding:16px 14px 14px;text-align:center;min-width:0}
.blk .l{font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.blk .v{font:600 30px var(--font);letter-spacing:-.02em;margin:8px 0 5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.blk .s{font-size:12px;color:var(--muted)}
.tag{font:500 10px var(--font);color:var(--warn);border:1px solid #3a3426;border-radius:999px;padding:1px 7px;margin-left:6px;letter-spacing:.04em;vertical-align:1px}
.tag.ok{color:var(--good);border-color:#2c4a3c}.tag.bad{color:var(--bad);border-color:#4a2c34}.tag.mut{color:var(--faint);border-color:var(--border)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--gap)}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--soft)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:500 10.5px var(--font);letter-spacing:.06em;color:var(--faint);text-align:right;padding:6px 10px;text-transform:uppercase}
.tbl td{padding:9px 10px;text-align:right;color:var(--muted);border-top:1px solid var(--soft)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{color:var(--text)}
.tbl tr.sel td{background:var(--panel2);color:var(--text);font-weight:500}
.tblwrap{overflow:auto;max-height:520px}
input[type=date]{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:4px 10px;font:500 12px var(--font);color-scheme:dark}
.fld{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font:12.5px var(--font);color-scheme:dark;max-width:100%}
textarea.fld{font:12px var(--mono);width:100%;min-height:110px;resize:vertical;box-sizing:border-box}
.scform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.scform label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
/* P&L cumulative chart (the Eagano dash chart: view, metric, range, headline, line + tooltip) */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ranges{display:flex;gap:3px;flex-wrap:wrap}
.rb{background:var(--panel2);border:1px solid var(--border);color:var(--faint);font:500 10px var(--font);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.rb:hover{color:var(--muted)}
.rb.on{color:var(--text);border-color:#3a3f46;background:#1b1f24}
.cumbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 4px}
.cumdates{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.cumdates input[type=date]{border-radius:6px;font-size:10.5px;padding:3px 8px;background:var(--panel2)}
.cumhead{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px;flex-wrap:wrap}
.cumv{font:600 34px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.cumd{font-size:11px;color:var(--faint);letter-spacing:.02em}
.cumwrap{position:relative;min-height:220px}
.cumwrap svg{display:block;width:100%}
.cumwrap svg text{font:400 10px var(--font);fill:#6f6f78}
.ctip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid #2c2c33;border-radius:8px;padding:9px 11px;font-size:11px;color:var(--muted);min-width:170px;z-index:2;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.ctip .h{color:var(--text);font-weight:600;margin-bottom:5px}
.ctip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums;line-height:1.7}
.ctip .f{display:flex;justify-content:space-between;gap:14px;color:var(--text);font-weight:600;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
@media (max-width:700px){.cumv{font-size:26px}.rb{font-size:9px;padding:4px 7px}.cumdates{margin-left:0}}
.fnr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px) minmax(0,1fr);align-items:center;gap:12px;min-height:62px}
@media (max-width:600px){.fnr{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr);gap:8px}}
/* Payouts */
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap);margin-top:12px}
.pay{border:1px solid var(--soft);border-radius:10px;background:var(--panel2);padding:12px 14px;min-width:0}
.pay .n{font:500 12.5px var(--font);color:var(--text);display:flex;justify-content:space-between;gap:8px}
.pay .big{font:600 22px var(--font);font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:-.01em}
.pay .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.pay .kv{font-size:12px;padding:5px 0}
.funnel{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;padding:24px 10px}
/* Brief */
.brief-body h3,.brief-body h4{margin:14px 0 4px;font-size:13.5px;color:var(--accent)}
.brief-body ul{margin:0;padding-left:18px}.brief-body li{margin:3px 0;font-size:13px;color:var(--dim)}
.brief-body p{margin:6px 0;font-size:13.5px;color:var(--dim)}
.brief-body b{color:var(--text);font-weight:500}
.brief-body .warnbox{border:1px solid #3a3426;color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12.5px;margin:6px 0}
/* Agents */
.agents{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:900px){.agents{grid-template-columns:minmax(0,1fr)}}
.alist{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px 10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}
@media (max-width:900px){.alist{position:static;max-height:280px}}
.alist .h{font:500 10.5px var(--font);letter-spacing:.08em;color:var(--faint);margin:12px 8px 4px;text-transform:uppercase}
.alist a{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:12.5px;color:#6f6f78;text-decoration:none}
.alist a.b{color:var(--dim)}
.alist a.on{background:var(--panel2);color:var(--text);font-weight:500}
.alist a:hover{color:var(--text)}
.sw{width:7px;height:7px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--dim)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate form{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;display:grid;gap:12px;width:min(420px,100%)}
.gate input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font:14px var(--mono)}
.rowx{border:1px solid var(--soft);border-radius:8px;padding:9px 10px;display:grid;gap:3px;background:var(--panel2);margin-bottom:8px;font-size:12.5px}
.rowx.alarm{border-color:#4a2c34}
.meta{font:10.5px var(--mono);color:var(--faint);display:flex;gap:8px;flex-wrap:wrap}
.fd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--faint)}
.fd.fresh{background:var(--good)}.fd.stale,.fd.failing{background:var(--bad)}
  .pane{height:calc(100vh - 120px);min-height:420px;display:flex;flex-direction:column;overflow:hidden}
  .pane-scroll{flex:1;min-height:0;overflow-y:auto;margin-top:12px;padding-right:4px}
  @media (max-width:1000px){ .pane{height:auto;max-height:80vh} }
  .todo{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .todo-row{display:flex;gap:10px;align-items:flex-start}
  .todo .num{color:var(--faint);font-size:12px;min-width:16px;padding-top:2px;text-align:right}
  .todo .tick{width:16px;height:16px;margin:2px 0 0;flex:none;accent-color:var(--good);cursor:pointer}
  .todo span.tick{border:1px dashed var(--faint);border-radius:4px;cursor:default}
  .todo span.tick.on{border:1px solid var(--good);background:var(--good)}
  .todo-main{flex:1;min-width:0}
  .todo-t{font-size:14px;color:var(--text)}
  .todo-s{font-size:12px;color:var(--muted);margin-top:2px}
  .todo details summary{font-size:12px;color:var(--faint);cursor:pointer;margin-top:4px}
  .todo details .card{margin-top:8px}
  .todo.done{opacity:.5}
  .todo.done .todo-t{text-decoration:line-through}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <div class="lab">Store Brain</div>
    <div style="font:600 22px var(--font)">Eagano LLC</div>
    <label for="keyIn" style="color:var(--muted);font-size:13px">Enter your dashboard key. It stays in this browser tab only.</label>
    <input id="keyIn" type="password" autocomplete="off" required>
    <button class="btn p" type="submit">Open</button>
  </form>
</div>

<div class="gate" id="loading"><div style="display:grid;gap:10px;justify-items:center;color:var(--muted)"><div style="font:600 18px var(--font);color:var(--text)">Eagano LLC</div><div id="loadMsg"><span class="dot live" style="background:var(--good);margin-right:8px"></span>Waking the brain…</div></div></div>
<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">Eagano LLC</div>
    <div class="brand-sub">store brain · every agent</div>
    <nav class="nav" id="nav">
      <a href="#/home" data-p="home">Home</a>
      <a href="#/pnl" data-p="pnl">P&amp;L</a>
      <a href="#/brief" data-p="brief">To do <span class="n" id="needN"></span></a>
      <a href="#/agents" data-p="agents">Agents</a>
    </nav>
    <div class="side-foot"><span id="ver">—</span><span id="aiCost"></span></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="pills" id="stores"></div>
      <span class="status" id="status">—</span>
    </div>
    <div id="page"></div>
  </main>
</div>

<script src="/kfb-bookmarklet.js"></script>
<script>
(function(){
  "use strict";
  var KEY_STORE="sb_mc_key", STORE_PICK="sb_store";

  /* ---------------- key + loading ---------------- */

    var m=/(?:^|[#&])key=([^&]+)/.exec(location.hash), k=m?decodeURIComponent(m[1]):null;
    if(k){ try{sessionStorage.setItem(KEY_STORE,k)}catch(e){} history.replaceState(null,"",location.pathname+"#/home"); return k; }
    try{ return sessionStorage.getItem(KEY_STORE) }catch(e){ return null }
  }

  }
  $("#gateForm").addEventListener("submit",function(e){

    try{sessionStorage.setItem(KEY_STORE,key)}catch(err){}
    load();

  async function load(){
    if(!key){ showGate(); return; }
    try{
      var r=await api("/api/state");
      if(r.status===401){ try{sessionStorage.removeItem(KEY_STORE)}catch(e){} key=null; showGate("That key didn't work."); return; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      state=await r.json();
      $("#gate").hidden=true; $("#loading").hidden=true; $("#app").hidden=false;
      /* The import page holds what the bookmarklet handed over: it is redrawn on its own events, not every 10 s. */
      if(Date.now()>busyUntil&&!selecting()&&!(route.p==="import"&&$("#kfbImp"))) render();

      $("#status").innerHTML='<span class="bad">Can\'t reach the brain: '+esc(err.message)+'</span>';

  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&key){ clearTimeout(timer); load(); } });

  /* ---------------- routing ---------------- */

  }

  try{ var sp=localStorage.getItem(STORE_PICK); if(sp) store=sp; }catch(e){}

  function liveStores(){ return (state.stores||[]).filter(function(s){return s.live}); }

  function ago(iso){ var m=Math.round((Date.now()-Date.parse(iso))/60000); if(m<1)return "just now"; if(m<60)return m+" min ago"; var h=Math.round(m/60); return h<48?h+" h ago":Math.round(h/24)+" d ago"; }
  function hm(iso){ var d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false}); }
  function money(n,signed){ if(n==null||!isFinite(n)) return "—"; var s=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?"−$":(signed&&n>0?"+$":"$"))+s; }
  function pct(n,dp){ return n==null||!isFinite(n)?"—":(n*100).toFixed(dp==null?1:dp)+"%"; }

  function lastTick(){ var j=((state.money||{}).jobs||[]).find(function(x){return x.job==="brain.tick"}); return j&&j.last_run_at?Date.parse(j.last_run_at):null; }

  function agentSub(){ var now=Date.now(), set={}; (state.events||[]).forEach(function(e){ if(now-Date.parse(e.at)<3600000&&inStore(e)&&agentOf(e.actor)) set[e.actor]=1; });
    var n=Object.keys(set).length, t=lastTick(); return n+" acted in the last hour"+(t?" · last check "+ago(new Date(t).toISOString()):""); }

  /* ---------------- HOME ---------------- */

  /* Closed days for the sparklines, oldest first (from the P&L feed: real rows only). */
  function lastDays(n){

    return (pnlData.days||[]).filter(function(r){return r.day<pnlData.today}).slice(0,n||14).reverse();
  }
  /* A bar per day (oldest → yesterday), same size everywhere, so up and down days read at
     a glance. colorFn(v,row) picks each bar's colour; unknown days are a grey stub, never 0. */
  function dayBars(rows,key,opt){
    /* Drawn at the card's real shape (no stretching): text and bars keep their proportions. */
    opt=opt||{}; var W=480,H=72,T=6,B=16, ih=H-T-B;
    if(!rows||!rows.length) return '<svg class="bars" viewBox="0 0 '+W+' '+H+'"></svg>';
    var vals=rows.map(function(r){return r[key]}), known=vals.filter(function(v){return v!=null&&isFinite(v)});
    var hi=Math.max.apply(null,known.concat([0,opt.ref||0])), lo=Math.min.apply(null,known.concat([0]));
    if(hi===lo) hi=lo+1;
    var n=rows.length, slot=W/n, bw=Math.max(6,Math.min(22,slot*.5)), y=function(v){return T+(hi-v)/(hi-lo)*ih}, z=y(0), out='';
    if(opt.ref!=null) out+='<line x1="0" x2="'+W+'" y1="'+y(opt.ref).toFixed(1)+'" y2="'+y(opt.ref).toFixed(1)+'" stroke="#a3a3ae" stroke-opacity=".55" stroke-dasharray="3 3"/>';
    rows.forEach(function(r,i){
      var cx=slot*i+slot/2, v=vals[i], last=i===n-1, wd=new Date(r.day+"T12:00:00Z").toLocaleDateString(undefined,{weekday:"narrow",timeZone:"UTC"});
      out+='<text x="'+cx.toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" style="font:'+(last?"600":"400")+' 10px Inter;fill:'+(last?"#e8e8ea":"#5c5c66")+'">'+esc(wd)+'</text>';
      if(v==null||!isFinite(v)){ out+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(z-1.5).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="3" rx="1" fill="#33333c"><title>'+esc(fmtDay(r.day,true))+': unknown</title></rect>'; return; }
      var top=Math.min(y(v),z), h=Math.max(2,Math.abs(y(v)-z)), c=opt.color(v,r);
      out+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+c+'" opacity="'+(last?1:.62)+'"><title>'+esc(fmtDay(r.day,true))+': '+esc(opt.fmt(v))+'</title></rect>';
    });
    if(lo<0) out+='<line x1="0" x2="'+W+'" y1="'+z.toFixed(1)+'" y2="'+z.toFixed(1)+'" stroke="#3a3a44"/>';
    return '<svg class="bars" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+out+'</svg>';
  }
  var PROFIT_C=function(v){return v<0?"#ff8fab":"#6fe3b4"};
  function spark(rows,key,opt){
    opt=opt||{}; var W=240,H=44;
    var vals=(rows||[]).map(function(r){return typeof key==="function"?key(r):r[key]}), known=vals.filter(function(v){return v!=null&&isFinite(v)});
    if(!rows||rows.length<2||known.length<2) return '<svg class="spk" viewBox="0 0 '+W+' '+H+'"><line x1="0" x2="'+W+'" y1="'+(H-6)+'" y2="'+(H-6)+'" stroke="#26262b" stroke-dasharray="2 4"/></svg>';
    var lo=Math.min.apply(null,known.concat(opt.zero?[0]:[])), hi=Math.max.apply(null,known.concat(opt.ref!=null?[opt.ref]:[]));
    if(hi===lo) hi=lo+1;
    var x=function(i){return i*(W-6)/(rows.length-1)+3}, y=function(v){return H-4-(v-lo)/(hi-lo)*(H-10)};
    var out='';
    if(opt.bars){ var bw=Math.max(4,(W-6)/rows.length-4), z=y(0);
      out+='<line x1="0" x2="'+W+'" y1="'+z.toFixed(1)+'" y2="'+z.toFixed(1)+'" stroke="#2a2a33"/>';
      vals.forEach(function(v,i){ if(v==null){ out+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+(z-1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="2" fill="#3a3a44"><title>'+esc(rows[i].day)+': unknown</title></rect>'; return; }
        var top=Math.min(y(v),z), hh=Math.max(1.5,Math.abs(y(v)-z));
        out+='<rect x="'+(x(i)-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="1.5" fill="'+(v<0?"#ff8fab":"#6fe3b4")+'" opacity="'+(i===rows.length-1?1:.55)+'"><title>'+esc(rows[i].day)+': '+esc(money(v,true))+'</title></rect>'; });
    } else {
      if(opt.ref!=null) out+='<line x1="0" x2="'+W+'" y1="'+y(opt.ref).toFixed(1)+'" y2="'+y(opt.ref).toFixed(1)+'" stroke="#8a8a93" stroke-opacity=".6" stroke-dasharray="3 3"/>';
      var d="", pen=false, first=null, last=null;
      vals.forEach(function(v,i){ if(v==null||!isFinite(v)){pen=false;return;} d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); pen=true; if(first==null) first=i; last=i; });
      var gid="g"+Math.random().toString(36).slice(2,8);
      out+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+opt.color+'" stop-opacity=".35"/><stop offset="1" stop-color="'+opt.color+'" stop-opacity="0"/></linearGradient></defs>';
      if(vals.every(function(v){return v!=null&&isFinite(v)})) out+='<path d="'+d+' L'+x(last).toFixed(1)+' '+H+' L'+x(first).toFixed(1)+' '+H+'Z" fill="url(#'+gid+')"/>';
      out+='<path d="'+d+'" fill="none" stroke="'+opt.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
      if(last!=null) out+='<circle cx="'+x(last).toFixed(1)+'" cy="'+y(vals[last]).toFixed(1)+'" r="3" fill="'+opt.color+'"/>';
    }
    return '<svg class="spk" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+out+'</svg>';
  }
  /* Built vs planned per department, as one segmented bar in the department colours. */
  function agentBar(){
    var h='';
    state.departments.forEach(function(d){ var ag=state.agents.filter(function(a){return a.dept===d.id});
      h+='<span title="'+esc(d.short+": "+ag.filter(isOn).length+" of "+ag.length+" built")+'" style="flex:'+ag.length+';display:flex;gap:2px">'+ag.map(function(a){return '<i style="flex:1;height:8px;border-radius:2px;background:'+PAL[d.id]+';opacity:'+(isOn(a)?1:.13)+'"></i>'}).join("")+'</span>'; });
    return '<div style="display:flex;gap:6px;margin-top:auto;padding-top:16px">'+h+'</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:6px">'+state.departments.map(function(d){return '<span>'+esc(d.short)+'</span>'}).join("")+'</div>';
  }
  /* Per-store cards: last 14 days of revenue + yesterday's ROAS against break-even as a ring. */

      var roas=y.roas, be=y.breakeven_roas, frac=roas!=null&&be?Math.min(1,roas/(be*2)):0, R=24, C=2*Math.PI*R, ok=roas!=null&&be!=null&&roas>=be;
      var ring='<svg class="ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="'+R+'" fill="none" stroke="#24242b" stroke-width="5"/>'+

        (be?'<line x1="29" y1="'+(29-R-4)+'" x2="29" y2="'+(29-R+4)+'" stroke="#e8e8ea" stroke-width="1.5" transform="rotate(180 29 29)"/>':'')+

      var c={hc:"#b9d3ff",aub:"#ffb38a",mar:"#b69cff"}[st.id]||"#b9d3ff";

        '<div style="grid-column:1 / -1">'+dayBars(rows,"profit",{color:PROFIT_C,fmt:function(v){return money(v,true)}})+'</div><div class="m" style="grid-column:1 / -1">Daily profit, 14 days · ring = yesterday ROAS</div></div>';
    }).join("")+'</div>';

      kpi("Yesterday ROAS",x2(y.roas),be!=null?"green = above break-even "+x2(be)+" (dashed)":"",y.roas!=null&&be!=null?(y.roas>=be?"ok-t":"bad-t"):"",dayBars(days,"roas",{ref:be,color:function(v,r){var b=r.breakeven_roas!=null?r.breakeven_roas:be; return b==null?"#7cc4ff":v>=b?"#6fe3b4":"#ff8fab"},fmt:function(v){return x2(v)}}),"#7cc4ff")+

    var n=todoList();

      (n.length?n.map(function(x){ var c=x.a&&x.a.card;

  /* ---------------- BRIEF ---------------- */
  function mdHtml(md){
    var out=[], list=false;
    function inline(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)_([^_]+)_(?=\s|$|[.,;:)])/g,"$1<i>$2</i>"); }

      var t=line.trim(), bullet=/^[-*•]\s+/.test(t);

      if(!t) return;
      if(bullet){ if(!list){out.push("<ul>");list=true;} out.push("<li>"+inline(t.replace(/^[-*•]\s+/,""))+"</li>"); return; }
      var h=/^(#{1,3})\s+(.*)$/.exec(t);
      if(h){ var n=h[1].length+2; out.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); return; }
      if(t.charAt(0)===">"){ out.push('<div class="warnbox">'+inline(t.replace(/^>\s*/,""))+"</div>"); return; }

  var vaultCache=null;
  function vaultInner(){
    var c=vaultCache;

    h+='<div class="note" style="margin:0 0 10px">'+esc(items.length)+' item'+(items.length===1?"":"s")+' pending. Copy each note to its vault path exactly as shown, then mark it copied. The brain never writes to the vault itself.</div>';

  async function loadVault(){
    if(vaultCache&&vaultCache.loading) return;
    vaultCache=Object.assign(vaultCache||{},{loading:true});
    try{ var r=await api("/api/vault/outbox?limit=200"); var j=await r.json(); if(!j.ok) throw new Error(j.error||("HTTP "+r.status));
      vaultCache={at:Date.now(),items:j.items||[]};
    }catch(e){ vaultCache={at:Date.now(),error:String(e&&e.message||"failed")}; }
    if($("#vaultBox")&&Date.now()>busyUntil) $("#vaultBox").innerHTML=vaultInner();
  }
  async function markVault(ids,btn){
    busyUntil=Date.now()+20000;
    document.querySelectorAll("#vaultBox button").forEach(function(x){x.disabled=true});
    var ok=false, msg="";
    try{ var r=await api("/api/vault/outbox/copied",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ids:ids.map(Number)})}); var b=await r.json();
      ok=!!b.ok; msg=b.ok?("Marked "+b.marked+" as copied"+(b.marked<ids.length?" ("+(ids.length-b.marked)+" were already marked)":"")):("Not recorded: "+(b.error||"error"));
    }catch(e){ msg="Could not reach the brain. Nothing was recorded."; }
    var out=$("#vaultOut"); if(out) out.innerHTML='<div class="note '+(ok?"ok-t":"bad-t")+'">'+esc(msg)+'</div>';
    if(ok){ busyUntil=0; vaultCache=null; setTimeout(function(){ if($("#vaultBox")) $("#vaultBox").innerHTML=vaultInner(); },800); }
    else { busyUntil=Date.now()+12000; document.querySelectorAll("#vaultBox button").forEach(function(x){x.disabled=false}); }
  }

  /* Parse the textarea: "M 110 48 80 60" per line → {size, chest, shoulder, length, sleeve, waist}. */
  function scParse(text){
    var cols=["chest","shoulder","length","sleeve","waist"], rows=[];
    String(text||"").split(/\n+/).forEach(function(line){
      var t=line.trim().split(/[\s,;\t]+/).filter(Boolean); if(!t.length) return;
      var r={size:t[0]}; cols.forEach(function(k,i){ var v=t[i+1]; r[k]=(v==null||v==="-"||v==="x")?null:v; }); rows.push(r);
    });

  /* ---------------- KFB MORNING IMPORT (#/import/kfb) ----------------
     The bookmarklet (kfb-bookmarklet.js) reads KFB in Reilly's own logged-in tab, view only,
     and hands the rows over by postMessage. Only the exact KFB origins below are listened to,
     and only from the tab that opened this one. Nothing leaves this page until Import is
     pressed, and then only to this brain with the normal key. No key is in the bookmark. */
  var KFB_ORIGINS=["https://www.kungfubuy.com","https://kungfubuy.com"];
  var kfbIn={payload:null,from:null,ignored:{},error:null,result:null,busy:false};
  function kfbShape(p){
    if(!p||typeof p!=="object"||Array.isArray(p)) return "not a JSON object";
    if(p.kind!=="kfb-import"||p.version!==1) return "not a KFB import (kind or version)";
    if(KFB_ORIGINS.indexOf(p.origin)<0) return "origin "+String(p.origin)+" is not KungFuBuy";
    if(isNaN(Date.parse(p.fetched_at))) return "no read time";
    if(!p.sections||typeof p.sections!=="object") return "no sections";
    var ks=Object.keys(p.sections), any=false;
    for(var i=0;i<ks.length;i++){
      if(["quotes","orders","bills"].indexOf(ks[i])<0) return "unknown section "+ks[i];
      var s=p.sections[ks[i]];
      if(!s||typeof s.ok!=="boolean") return ks[i]+": no ok flag";
      if(s.ok){ if(!Array.isArray(s.rows)) return ks[i]+": rows is not a list"; if(s.rows.some(function(r){return !r||typeof r!=="object"||Array.isArray(r)})) return ks[i]+": a row is not an object"; any=true; }
    }
    return any?null:"no section was read";
  }
  /* The KFB tab this page answers: the one that opened it, or (a reused tab whose opener is an
     older KFB tab) the KFB tab that said hello. */
  var kfbPeer=null;
  function kfbTrusted(ev){ return KFB_ORIGINS.indexOf(ev.origin)>=0&&!!ev.source&&(ev.source===window.opener||ev.source===kfbPeer); }
  window.addEventListener("message",function(ev){
    var d=ev.data;
    if(!d||typeof d!=="object") return;
    if(d.type==="sb-kfb-hello"){
      if(KFB_ORIGINS.indexOf(ev.origin)<0||!ev.source) return;
      kfbPeer=ev.source;
      try{ ev.source.postMessage({type:"sb-kfb-ready"},ev.origin); }catch(e){}
      return;
    }
    if(d.type!=="sb-kfb-data") return;
    if(!kfbTrusted(ev)){ kfbIn.ignored[String(ev.origin)]=1; drawImport(); return; }
    var err=kfbShape(d.payload);
    if(!err&&d.payload.origin!==ev.origin) err="the data names "+d.payload.origin+" but came from "+ev.origin;
    if(err){ kfbIn.error="Refused what the bookmark sent: "+err; drawImport(); return; }
    kfbIn.payload=d.payload; kfbIn.from=ev.origin; kfbIn.error=null; kfbIn.result=null;
    try{ ev.source.postMessage({type:"sb-kfb-received"},ev.origin); }catch(e){}
    drawImport();
  });
  /* Handshake: say "ready" to the KFB tab that opened this one, every second for a minute (the
     bookmark may still be reading). A message to a tab on another origin is simply dropped. */
  (function(){
    if(!/^#\/import\/kfb/.test(location.hash)||!window.opener) return;
    var n=0;
    function hello(){ KFB_ORIGINS.forEach(function(o){ try{ window.opener.postMessage({type:"sb-kfb-ready"},o); }catch(e){} }); }
    hello();
    var t=setInterval(function(){ if(kfbIn.payload||++n>60||!window.opener){ clearInterval(t); return; } hello(); },1000);
  })();
  function kfbCode(r){
    var v=r&&(r.un_shop_url||r.shop_url||r.shop_code||(Array.isArray(r.items)&&r.items[0]&&r.items[0].un_shop_url));
    return v?String(v).toLowerCase().trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/\.myshopify\.com$/,""):null;
  }
  var KFB_LINE_KEYS=["details","detail","bill_details","lines","list","items","children","sub_orders","suborders","order_list","orders"];
  function kfbFlat(section,rows){
    if(section!=="bills") return rows;
    var out=[]; rows.forEach(function(r){ var k=KFB_LINE_KEYS.find(function(x){return Array.isArray(r[x])&&r[x].length&&typeof r[x][0]==="object"});
      if(k) r[k].forEach(function(l){ out.push(kfbCode(l)?l:Object.assign({un_shop_url:kfbCode(r)},l)); }); else out.push(r); });
    return out;
  }
  var KFB_DATE_KEYS=["shopify_create_at","bill_time","quote_time","update_time","create_time","create_at","un_create_at","order_time","created_at"];

    h+='</tbody></table><div class="lab" style="margin-top:12px">By store (KFB shop code)</div><table class="tbl" style="font-size:12.5px"><thead><tr><th>Store</th><th>Quotes</th><th>Orders</th><th>Bill lines</th></tr></thead><tbody>';
    Object.keys(split).sort().forEach(function(c){ var nm=kfbShopName(c);
      h+='<tr><td'+(nm?'':' class="bad-t"')+'>'+esc(nm?nm+" · "+c:"Unknown shop "+c+": will be refused")+'</td><td>'+split[c].quotes+'</td><td>'+split[c].orders+'</td><td>'+split[c].bills+'</td></tr>'; });
    return h+'</tbody></table>';
  }
  function kfbResult(r){
    if(!r.ok) return '<div class="rowx alarm">Not imported: '+esc(r.error||"error")+'</div>';
    if(r.duplicate) return '<div class="rowx"><span class="ok-t">Already imported today: nothing changed.</span></div>';
    var c=r.counts||{}, q=c.quotes||{}, o=c.orders||{}, b=c.bills||{}, tp=b.to_pay||{};
    var refused=function(m){ var k=Object.keys(m||{}); return k.length?k.map(function(x){return m[x]+" × "+x}).join("; "):"none"; };
    return '<div class="rowx"><b class="ok-t" style="font-weight:500">Imported</b>'+
      kvx("Quotes",esc(q.inserted||0)+" new · "+esc(q.unchanged||0)+" already known"+(q.similar_recorded?" · "+esc(q.similar_recorded)+" similar offers":""))+
      kvx("Orders",esc(o.inserted||0)+" new · "+esc(o.updated||0)+" changed · "+esc(o.unchanged||0)+" unchanged")+
      kvx("Bills",esc(b.inserted||0)+" new · "+esc(b.updated||0)+" changed · "+esc(b.unchanged||0)+" unchanged · "+esc(b.lines||0)+" lines")+
      kvx("Bills to pay",esc(tp.inserted||0)+" new · "+esc(tp.updated||0)+" changed"+(tp.paid_state_unknown?' · <span class="warn-t">'+esc(tp.paid_state_unknown)+" paid state unknown</span>":"")+
        (tp.no_amount?' · <span class="warn-t">'+esc(tp.no_amount)+" with no amount (not listed, check in KFB)</span>":"")+
        (tp.incomplete?' · <span class="warn-t">'+esc(tp.incomplete)+" cut off by the read (not listed yet)</span>":""))+
      kvx("Refused",esc(refused(q.refused))+" | "+esc(refused(o.refused))+" | "+esc(refused(b.refused_lines)))+
      ((c.unknown_shops||[]).length?'<div class="note bad-t">Unknown KFB shops refused: '+esc(c.unknown_shops.join(", "))+'</div>':'')+'</div>';
  }
  function kfbBookmarkHref(){ var f=window.SB_KFB_BOOKMARKLET; return typeof f==="function"?"javascript:"+encodeURIComponent("("+f.toString()+")()"):null; }
  function importInner(){
    var ki=state.kfbImport||{}, h="", p=kfbIn.payload;
    h+='<div class="rowx'+(ki.doneToday?"":" alarm")+'"><b style="font-weight:500">'+(ki.doneToday?"Imported today":"KFB import not done today")+'</b><span class="meta"><span>'+(ki.lastAt?"last import "+esc(ago(ki.lastAt)):"never imported")+'</span><span>9:00 phone reminder: '+(ki.reminder==="live"?"on":"shadow (not sent)")+'</span></span></div>';
    var ign=Object.keys(kfbIn.ignored);
    if(ign.length) h+='<div class="note warn-t">Ignored data from '+esc(ign.join(", "))+': not KungFuBuy, or not the tab that opened this page.</div>';
    if(kfbIn.error) h+='<div class="rowx alarm">'+esc(kfbIn.error)+'</div>';
    if(!p) h+='<div class="empty">'+(window.opener?"Waiting for the KungFuBuy tab to hand over what it read…":"Nothing received yet. On KungFuBuy (logged in), click the bookmark below, or paste the saved JSON.")+'</div>';
    else h+=kfbSummary(p)+'<div class="btns" style="margin-top:10px"><button class="btn p" id="kfbGo"'+(kfbIn.busy?" disabled":"")+'>'+(kfbIn.busy?"Importing…":"Import")+'</button><button class="btn" id="kfbClear">Discard</button></div>';
    if(kfbIn.result) h+='<div style="margin-top:10px">'+kfbResult(kfbIn.result)+'</div>';
    var href=kfbBookmarkHref();
    h+='<div class="lab" style="margin-top:16px">The bookmark</div>'+(href?'<div class="rowx"><div><a class="btn p" id="kfbBm" href="'+esc(href)+'">KFB → Store Brain</a></div><span style="color:var(--muted)">Drag this button to your bookmarks bar once. Each morning, on KungFuBuy and logged in, click it: it reads quotations, orders and bills (view only) and opens this page.</span></div>':'<div class="empty">The bookmark file did not load. Reload this page.</div>');
    h+='<div class="lab" style="margin-top:16px">Paste JSON (when the bookmark saved a file instead)</div><textarea class="fld" id="kfbPaste" placeholder="Paste the kfb-import JSON here"></textarea><div class="scform"><button class="btn" id="kfbUse">Use pasted JSON</button><label>or a file <input type="file" id="kfbFile" accept="application/json,.json" class="fld"></label></div>';
    return h;
  }
  function importPage(){
    return '<div class="box"><div style="font:600 20px var(--font)">KFB morning import</div><div class="note">Reads quotations, orders and bills from KungFuBuy in your own logged-in tab (view only) and files them for the Quote Desk, Denial Sync, Similar QC, COGS Matcher, Order Watcher and Claims. Nothing is ever written to KungFuBuy.</div></div><div class="box" id="kfbImp" style="margin-top:12px">'+importInner()+'</div>';
  }
  function drawImport(){ if(state&&route.p==="import"&&$("#kfbImp")){ $("#kfbImp").innerHTML=importInner(); wireImport(); } }
  function kfbTake(text,from){
    var p=null; try{ p=JSON.parse(text); }catch(e){ kfbIn.error="That is not valid JSON."; drawImport(); return; }
    var err=kfbShape(p); if(err){ kfbIn.error="Refused the pasted data: "+err; drawImport(); return; }
    kfbIn.payload=p; kfbIn.from=from; kfbIn.error=null; kfbIn.result=null; drawImport();
  }
  async function kfbImport(){
    if(!kfbIn.payload||kfbIn.busy) return;
    kfbIn.busy=true; drawImport();
    try{
      var r=await api("/api/import/kfb",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({payload:kfbIn.payload})});
      var j=await r.json().catch(function(){return {ok:false,error:"HTTP "+r.status}});
      if(r.status===401) j={ok:false,error:"the dashboard key was refused. Reload the page and enter it again."};
      kfbIn.result=j;
    }catch(e){ kfbIn.result={ok:false,error:"could not reach the brain. Nothing was imported."}; }
    kfbIn.busy=false;
    if(kfbIn.result.ok) await load();
    drawImport();
  }
  function wireImport(){
    var go=$("#kfbGo"); if(go) go.addEventListener("click",kfbImport);
    var cl=$("#kfbClear"); if(cl) cl.addEventListener("click",function(){ kfbIn.payload=null; kfbIn.result=null; drawImport(); });
    var bm=$("#kfbBm"); if(bm) bm.addEventListener("click",function(e){ e.preventDefault(); bm.textContent="Drag me to the bookmarks bar"; });
    var use=$("#kfbUse"); if(use) use.addEventListener("click",function(){ kfbTake($("#kfbPaste").value,"pasted JSON"); });
    var f=$("#kfbFile"); if(f) f.addEventListener("change",function(){ var file=f.files&&f.files[0]; if(!file) return; var rd=new FileReader(); rd.onload=function(){ kfbTake(String(rd.result),file.name); }; rd.readAsText(file); });
  }

  /* ---------------- actions ---------------- */
  function wire(){
    if(route.p==="pnl") wirePnl();
    if(route.p==="import") wireImport();
    document.querySelectorAll("button[data-ap]").forEach(function(b){ b.addEventListener("click",function(){ decide(b.dataset.ap,b.dataset.choice,b) }) });
    document.querySelectorAll("button[data-copy]").forEach(function(b){ b.addEventListener("click",function(){
      var m=((state.supplier||{}).kfbMessages||[]).find(function(x){return String(x.id)===b.dataset.copy});
      if(m&&navigator.clipboard) navigator.clipboard.writeText(m.body).then(function(){b.textContent="Copied"},function(){b.textContent="Copy failed"});
      busyUntil=Date.now()+15000;
    }) });
    document.querySelectorAll("button[data-sent]").forEach(function(b){ b.addEventListener("click",function(){ markSent(b.dataset.sent,b) }) });
    document.querySelectorAll("input[data-tick-ap],input[data-tick-kfb]").forEach(function(cb){ cb.addEventListener("change",function(){ tick(cb) }) });
    if($("#rewrite")) $("#rewrite").addEventListener("click",async function(){ var b=$("#rewrite"); b.disabled=true; b.textContent="Writing…"; busyUntil=Date.now()+90000;
      try{ var r=await api("/api/brief/rewrite",{method:"POST"}); var j=await r.json();
        if(j.ok){ busyUntil=0; load(); } else { $("#rewriteOut").innerHTML='<div class="note bad-t">'+esc(j.error||"failed")+'</div>'; b.disabled=false; b.textContent="Rewrite now"; busyUntil=Date.now()+12000; }
      }catch(e){ $("#rewriteOut").innerHTML='<div class="note bad-t">Couldn\'t reach the brain.</div>'; b.disabled=false; b.textContent="Rewrite now"; busyUntil=Date.now()+12000; } });
    document.querySelectorAll("button[data-setup]").forEach(function(b){ b.addEventListener("click",function(){ runSetup(b) }) });
    document.querySelectorAll("button[data-google]").forEach(function(b){ b.addEventListener("click",function(){ google(b.dataset.google,b) }) });
    if($("#outConn")) loadConnections();
  }
  /* Success: refresh soon. Failure: keep the message on screen for 12 s before redrawing. */
  function afterAction(ok){ if(ok){ busyUntil=0; setTimeout(load,800); } else { busyUntil=Date.now()+12000; clearTimeout(timer); timer=setTimeout(load,12500); } }
  function result(btn,ok,txt){ var out=btn.closest(".card,.rowx"); out.insertAdjacentHTML("beforeend",'<div class="note '+(ok?"ok-t":"bad-t")+'">'+esc(txt)+'</div>'); }
  async function decide(id,choice,btn){
    busyUntil=Date.now()+20000;
    btn.closest(".card").querySelectorAll("button").forEach(function(x){x.disabled=true});
    var ok=false;
    try{ var r=await api("/api/approvals/"+id+"/decide",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({choice:choice})}); var b=await r.json();
      ok=!!b.ok; result(btn,b.ok,b.ok?(b.status==="approved"?"Approved":"Rejected"):"Not recorded: "+(b.error||"error"));
    }catch(e){ result(btn,false,"Couldn't reach the brain. Nothing was recorded."); }
    afterAction(ok);
  }
  /* Ticking a row records the same thing as its Done / Mark sent button. */
  async function tick(cb){
    busyUntil=Date.now()+20000; cb.disabled=true; var row=cb.closest(".todo"); row.classList.add("done");
    var ok=false;
    try{ var r=cb.dataset.tickAp?await api("/api/approvals/"+cb.dataset.tickAp+"/decide",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({choice:cb.dataset.choice})}):await api("/api/kfb/"+cb.dataset.tickKfb+"/sent",{method:"POST"});
      var b=await r.json(); ok=!!b.ok; if(!ok) throw new Error(b.error||"error");
    }catch(e){ row.classList.remove("done"); cb.checked=false; cb.disabled=false; row.insertAdjacentHTML("beforeend",'<div class="note bad-t">Not recorded: '+esc(e.message||"couldn't reach the brain")+'</div>'); }
    afterAction(ok);
  }
  async function markSent(id,btn){
    busyUntil=Date.now()+20000; btn.disabled=true;
    var ok=false;
    try{ var r=await api("/api/kfb/"+id+"/sent",{method:"POST"}); var b=await r.json(); ok=!!b.ok; result(btn,b.ok,b.ok?"Recorded as sent":"Not recorded: "+(b.error||"error")); if(!b.ok) btn.disabled=false; }
    catch(e){ btn.disabled=false; result(btn,false,"Couldn't reach the brain. Nothing was recorded."); }
    afterAction(ok);
  }
  async function runSetup(btn){
    busyUntil=Date.now()+30000; btn.disabled=true; var out=btn.closest(".rowx").querySelector(".out"); out.innerHTML='<span class="meta">Working…</span>';
    try{ var r=await api(btn.dataset.setup,{method:"POST"}); var b=await r.json(); var k=btn.dataset.kind;
      out.innerHTML=b.ok?b.results.map(function(x){
        if(k==="phone") return '<div class="'+(x.sent?"ok-t":"bad-t")+'">'+(x.sent?"✓ Sent, check your phone":"✗ "+esc(x.reason||"not sent"))+'</div>';
        if(k==="hooks") return '<div class="'+(x.verified?"ok-t":"bad-t")+'">'+(x.verified?"✓ ":"✗ ")+esc(x.name)+(x.verified?" connected and verified":": "+esc((x.errors||[]).join(" | ")||"not verified"))+'</div>';
        return '<div class="'+(x.ok?"ok-t":"bad-t")+'">'+(x.ok?"✓ ":"✗ ")+esc(x.name)+(x.ok?' <span class="meta">'+esc(x.domain)+(x.missing&&x.missing.length?' · missing: '+esc(x.missing.join(", ")):' · all access granted')+'</span>':": "+esc(x.error))+'</div>';
      }).join(""):'<span class="bad-t">'+esc(b.error||("HTTP "+r.status))+'</span>';
    }catch(e){ out.innerHTML='<span class="bad-t">Couldn\'t reach the brain.</span>'; }
    btn.disabled=false;
  }
  async function google(target,btn){
    btn.disabled=true;
    try{ var r=await api("/api/admin/google/start",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({target:target})}); var j=await r.json();
      if(j.ok&&j.url){ window.location.assign(j.url); return; } result(btn,false,j.error||"failed");
    }catch(e){ result(btn,false,"Couldn't reach the brain."); }
    btn.disabled=false;
  }
  async function loadConnections(){
    try{ var r=await api("/api/admin/connections"); var j=await r.json(); if(!j.ok) throw 0;
      var g=j.google||{};
      var h=(g.connected?'<div class="ok-t">✓ Google: '+esc(g.account)+(g.missing&&g.missing.length?' <span class="warn-t">· missing: '+esc(g.missing.join(", "))+'</span>':'')+'</div>':'<div class="warn-t">· Google: '+(g.account?"saved but not verified, connect again":"not connected")+'</div>');
      h+=(j.mailboxes||[]).map(function(m){ return '<div style="margin:6px 0">'+(m.connected?'<span class="ok-t">✓</span>':'<span class="warn-t">·</span>')+' '+esc(m.name)+' <span class="meta" style="display:inline">'+esc(m.mailbox||"no inbox set up yet")+(m.mailbox?(m.connected?" · connected":" · not connected"):"")+'</span>'+(m.mailbox?' <button class="btn" data-google="'+esc(m.store)+'">'+(m.connected?"Reconnect":"Connect")+'</button>':'')+'</div>'; }).join("");
      h+='<div class="meta" style="margin-top:8px">'+Object.keys(j.secrets).map(function(n){return (j.secrets[n]?"✓ ":"· ")+esc(n)}).join(" · ")+'</div>';
      $("#outConn").innerHTML=h;
      document.querySelectorAll("#outConn button[data-google]").forEach(function(b){ b.addEventListener("click",function(){ google(b.dataset.google,b) }) });
      busyUntil=Date.now()+60000;
    }catch(e){ $("#outConn").innerHTML='<span class="meta">Couldn\'t load connections.</span>'; }
  }

  key=getKey(); route=parseRoute(); load();
})();
</script>
</body>
</html>
