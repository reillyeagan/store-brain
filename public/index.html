<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eagano LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Eagano dash language (CLAUDE.md) + one soft pastel per department (docs/specs/dashboard.md). */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --panel:#131316; --panel2:#17171b; --border:#26262b; --soft:#1d1d22;
  --text:#e8e8ea; --muted:#8a8a93; --faint:#54545c; --dim:#b9b9c0;
  --accent:#c7d2db; --good:#a9dcc4; --warn:#ecdc9f; --bad:#eab0bd; --blue:#aecdef; --peach:#efc0a8;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button{font-family:var(--font)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font:600 15px var(--font);padding:0 10px}
.brand-sub{font-size:11px;color:var(--faint);padding:2px 10px 18px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:13.5px}
.nav a:hover{color:var(--text)}
.nav a.on{background:var(--panel2);color:var(--text);font-weight:500}
.nav .n{font-size:11px;color:var(--bad);margin-left:6px}
.side-foot{margin-top:auto;font-size:11px;color:var(--faint);padding:0 10px;display:grid;gap:3px}
.main{padding:20px 24px 40px;min-width:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:4px;border-right:0;border-bottom:1px solid var(--border)}
  .brand-sub,.side-foot{display:none}
  .brand{padding-right:10px}
  .nav{display:flex;gap:2px}
  .main{padding:14px 16px 32px}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font:500 12px var(--font);background:none;cursor:pointer;white-space:nowrap}
.pill.on{border-color:var(--accent);color:var(--text)}
.pill.dash{border-style:dashed;color:var(--faint);cursor:default}
.status{font-size:12px;color:var(--faint)}
.status .ok{color:var(--good)}.status .bad{color:var(--bad)}
.lab{font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.box{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:16px 18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:10px 14px}
.kpi .l{font-size:11px;color:var(--faint)}
.kpi .v{font:600 20px var(--font);margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:1px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1100px){.home{grid-template-columns:minmax(0,1fr)}}
.mapbox{border:1px solid var(--border);border-radius:10px;background:#0e0e11;position:relative;overflow-x:auto}
#map{display:block;width:100%;min-width:760px;height:auto}
#map .lb{font:400 9.5px var(--font);fill:var(--muted)}
#map .lb.on{fill:var(--text);font-weight:500}
#map .hub{font:600 11px var(--font);fill:var(--text)}
#map .sub{font:400 9px var(--font);fill:var(--faint)}
#map .node{cursor:pointer}
#map .node:hover .lb{fill:var(--text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--faint);padding:10px 14px;border-top:1px solid var(--border)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--panel)}
.card .t{font:500 13px var(--font);display:flex;justify-content:space-between;gap:8px}
.card .t span{font:400 11px var(--font);color:var(--faint);white-space:nowrap}
.card .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.feed .r{display:grid;grid-template-columns:42px 8px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--soft);font-size:12px;color:var(--muted)}
.feed .r .tm{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.feed .r b{color:var(--text);font-weight:500}
.feed .r.alarm{color:var(--bad)}
.feed .r.fresh b::after{content:" · now";color:var(--good);font-weight:400;font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--faint)}
@keyframes blink{50%{opacity:.25}}
.live{animation:blink 1.4s infinite}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}
.btn{background:none;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font:500 12.5px var(--font);cursor:pointer}
.btn.p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.g{background:var(--good);color:var(--bg);border-color:var(--good)}
.btn.no{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg{white-space:pre-wrap;font:12px var(--mono);color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px}
.note{font-size:11.5px;color:var(--faint);margin-top:6px}
.ok-t,.tbl td.ok-t,.kv b.ok-t{color:var(--good)}.bad-t,.tbl td.bad-t,.kv b.bad-t{color:var(--bad)}.warn-t,.tbl td.warn-t,.kv b.warn-t{color:var(--warn)}
/* P&L */
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blk{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:16px 14px 14px;text-align:center;min-width:0}
.blk .l{font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.blk .v{font:600 30px var(--font);letter-spacing:-.02em;margin:8px 0 5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.blk .s{font-size:12px;color:var(--muted)}
.tag{font:500 10px var(--font);color:var(--warn);border:1px solid #3a3426;border-radius:999px;padding:1px 7px;margin-left:6px;letter-spacing:.04em;vertical-align:1px}
.tag.ok{color:var(--good);border-color:#2c4a3c}.tag.bad{color:var(--bad);border-color:#4a2c34}.tag.mut{color:var(--faint);border-color:var(--border)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--soft)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:500 10.5px var(--font);letter-spacing:.06em;color:var(--faint);text-align:right;padding:6px 10px;text-transform:uppercase}
.tbl td{padding:9px 10px;text-align:right;color:var(--muted);border-top:1px solid var(--soft)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{color:var(--text)}
.tbl tr.sel td{background:var(--panel2);color:var(--text);font-weight:500}
.tblwrap{overflow:auto;max-height:520px}
input[type=date]{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:4px 10px;font:500 12px var(--font);color-scheme:dark}
.funnel{display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;padding:24px 10px}
/* Brief */
.brief-body h3,.brief-body h4{margin:14px 0 4px;font-size:13.5px;color:var(--accent)}
.brief-body ul{margin:0;padding-left:18px}.brief-body li{margin:3px 0;font-size:13px;color:var(--dim)}
.brief-body p{margin:6px 0;font-size:13.5px;color:var(--dim)}
.brief-body b{color:var(--text);font-weight:500}
.brief-body .warnbox{border:1px solid #3a3426;color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12.5px;margin:6px 0}
/* Agents */
.agents{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.agents{grid-template-columns:minmax(0,1fr)}}
.alist{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px 10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}
@media (max-width:900px){.alist{position:static;max-height:280px}}
.alist .h{font:500 10.5px var(--font);letter-spacing:.08em;color:var(--faint);margin:12px 8px 4px;text-transform:uppercase}
.alist a{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:12.5px;color:#6f6f78;text-decoration:none}
.alist a.b{color:var(--dim)}
.alist a.on{background:var(--panel2);color:var(--text);font-weight:500}
.alist a:hover{color:var(--text)}
.sw{width:7px;height:7px;border-radius:50%;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--dim)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate form{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;display:grid;gap:12px;width:min(420px,100%)}
.gate input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font:14px var(--mono)}
.rowx{border:1px solid var(--soft);border-radius:8px;padding:9px 10px;display:grid;gap:3px;background:var(--panel2);margin-bottom:8px;font-size:12.5px}
.rowx.alarm{border-color:#4a2c34}
.meta{font:10.5px var(--mono);color:var(--faint);display:flex;gap:8px;flex-wrap:wrap}
.fd{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--faint)}
.fd.fresh{background:var(--good)}.fd.stale,.fd.failing{background:var(--bad)}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <div class="lab">Store Brain</div>
    <div style="font:600 22px var(--font)">Eagano LLC</div>
    <label for="keyIn" style="color:var(--muted);font-size:13px">Enter your dashboard key. It stays in this browser tab only.</label>
    <input id="keyIn" type="password" autocomplete="off" required>
    <button class="btn p" type="submit">Open</button>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">Eagano LLC</div>
    <div class="brand-sub">store brain · every agent</div>
    <nav class="nav" id="nav">
      <a href="#/home" data-p="home">Home</a>
      <a href="#/pnl" data-p="pnl">P&amp;L</a>
      <a href="#/brief" data-p="brief">Brief <span class="n" id="needN"></span></a>
      <a href="#/agents" data-p="agents">Agents</a>
    </nav>
    <div class="side-foot"><span id="ver">—</span><span id="aiCost"></span></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="pills" id="stores"></div>
      <span class="status" id="status">—</span>
    </div>
    <div id="page"></div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var KEY_STORE="sb_mc_key", STORE_PICK="sb_store";
  var key=null, state=null, timer=null, pnlData=null, pnlStore=null, pnlAt=0, agentCache={};
  var store="all", route={p:"home"}, pnlSel={period:"day",day:null};
  var busyUntil=0;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var PAL={core:"#c7d2db",media:"#c3b5e8",cs:"#efc0a8",sup:"#a9dcc4",pnl:"#ecdc9f",risk:"#eab0bd",ful:"#aecdef",cat:"#d5c2ea"};
  var SHORT={hc:"Holt & Crane",aub:"Auberlane",mar:"Marlowe"};
  var WORKING_MS=120000;

  /* ---------------- key + loading ---------------- */
  function getKey(){
    /* #key=... in the address (never ?key=), so the key never reaches the server in a URL */
    var m=/(?:^|[#&])key=([^&]+)/.exec(location.hash), k=m?decodeURIComponent(m[1]):null;
    if(k){ try{sessionStorage.setItem(KEY_STORE,k)}catch(e){} history.replaceState(null,"",location.pathname+"#/home"); return k; }
    try{ return sessionStorage.getItem(KEY_STORE) }catch(e){ return null }
  }
  function showGate(msg){
    $("#app").hidden=true; $("#gate").hidden=false;
    if(msg){ $("#keyIn").setCustomValidity(msg); $("#keyIn").reportValidity(); }
  }
  $("#gateForm").addEventListener("submit",function(e){
    e.preventDefault(); key=$("#keyIn").value.trim(); $("#keyIn").setCustomValidity("");
    try{sessionStorage.setItem(KEY_STORE,key)}catch(err){}
    load();
  });
  function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({"x-store-brain-key":key},opt.headers||{}); opt.cache="no-store"; return fetch(path,opt); }

  async function load(){
    if(!key){ showGate(); return; }
    try{
      var r=await api("/api/state");
      if(r.status===401){ try{sessionStorage.removeItem(KEY_STORE)}catch(e){} key=null; showGate("That key didn't work."); return; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      state=await r.json();
      $("#gate").hidden=true; $("#app").hidden=false;
      if(Date.now()>busyUntil) render();
    }catch(err){
      $("#status").innerHTML='<span class="bad">Can\'t reach the brain: '+esc(err.message)+'</span>';
    }
    clearTimeout(timer); timer=setTimeout(load,10000);
  }

  /* ---------------- routing ---------------- */
  function parseRoute(){
    var h=location.hash.replace(/^#\/?/,"").split("/");
    var p=["home","pnl","brief","agents"].indexOf(h[0])>=0?h[0]:"home";
    return {p:p,a:h[1]?decodeURIComponent(h[1]):null,b:h[2]?decodeURIComponent(h[2]):null};
  }
  window.addEventListener("hashchange",function(){ if(/key=/.test(location.hash)) return; route=parseRoute(); busyUntil=0; if(state) render(); window.scrollTo(0,0); });
  try{ var sp=localStorage.getItem(STORE_PICK); if(sp) store=sp; }catch(e){}

  /* ---------------- helpers ---------------- */
  function liveStores(){ return (state.stores||[]).filter(function(s){return s.live}); }
  function storeName(id){ var s=(state.stores||[]).find(function(x){return x.id===id}); return SHORT[id]||(s?s.name:id); }
  function agentOf(id){ return (state.agents||[]).find(function(x){return x.id===id}); }
  function actorName(id){ var a=agentOf(id)||(state.services||[]).find(function(x){return x.id===id})||(state.systems||[]).find(function(x){return x.id===id}); return a?a.name:id; }
  function deptOf(id){ var a=agentOf(id); return a?a.dept:(String(id).indexOf("svc.")===0||String(id).indexOf("sys.")===0?"core":String(id).split(".")[0]); }
  function colorOf(id){ return PAL[deptOf(id)]||"#8a8a93"; }
  function ago(iso){ var m=Math.round((Date.now()-Date.parse(iso))/60000); if(m<1)return "just now"; if(m<60)return m+" min ago"; var h=Math.round(m/60); return h<48?h+" h ago":Math.round(h/24)+" d ago"; }
  function hm(iso){ var d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:false}); }
  function money(n,signed){ if(n==null||!isFinite(n)) return "—"; var s=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?"−$":(signed&&n>0?"+$":"$"))+s; }
  function pct(n,dp){ return n==null||!isFinite(n)?"—":(n*100).toFixed(dp==null?1:dp)+"%"; }
  function x2(n){ return n==null||!isFinite(n)?"—":n.toFixed(2)+"x"; }
  function inStore(e){ return store==="all"||!e.store||e.store===store; }
  function isAlarm(e){ return /alarm|error|failed|mismatch/i.test(e.kind||""); }
  function recentEvents(){ var now=Date.now(); return (state.events||[]).filter(function(e){return now-Date.parse(e.at)<WORKING_MS}); }
  function workingAgents(){ var set={}; recentEvents().forEach(function(e){ if(agentOf(e.actor)) set[e.actor]=1; }); return Object.keys(set); }
  function builtCount(){ return (state.agents||[]).filter(function(a){return a.status!=="planned"}).length; }

  /* ---------------- frame ---------------- */
  function render(){
    route=parseRoute();
    document.querySelectorAll("#nav a").forEach(function(a){ a.classList.toggle("on",a.dataset.p===route.p); });
    $("#ver").textContent="v"+state.version;
    $("#aiCost").textContent="AI today $"+Number(state.aiCostToday||0).toFixed(2);
    var need=needs().length; $("#needN").textContent=need?need:"";
    var feeds=state.feeds||[], bad=feeds.filter(function(f){return f.state==="stale"||f.state==="failing"}).length;
    $("#status").innerHTML='Updated '+esc(hm(state.now))+' · '+(bad?'<span class="bad">● '+bad+' feed'+(bad>1?"s":"")+' stale</span>':'<span class="ok">● all feeds fresh</span>');
    var ls=liveStores();
    if(store!=="all"&&!ls.some(function(s){return s.id===store})) store="all";
    $("#stores").innerHTML='<button class="pill'+(store==="all"?" on":"")+'" data-s="all">All stores</button>'+
      ls.map(function(s){return '<button class="pill'+(store===s.id?" on":"")+'" data-s="'+esc(s.id)+'">'+esc(storeName(s.id))+'</button>'}).join("")+
      '<span class="pill dash" title="New stores come with the Store Factory">+ Add store</span>';
    document.querySelectorAll("#stores [data-s]").forEach(function(b){ b.addEventListener("click",function(){ store=b.dataset.s; try{localStorage.setItem(STORE_PICK,store)}catch(e){} busyUntil=0; render(); }); });
    var pg=$("#page");
    if(route.p==="home") pg.innerHTML=homePage();
    else if(route.p==="pnl") { pg.innerHTML=pnlShell(); loadPnl(); }
    else if(route.p==="brief") pg.innerHTML=briefPage();
    else pg.innerHTML=agentsPage();
    wire();
  }

  /* ---------------- HOME ---------------- */
  function yesterdayRow(){
    var pl=state.pnl||{stores:[],group:{}};
    if(store==="all") return pl.group&&pl.group.yesterday;
    var s=(pl.stores||[]).find(function(x){return x.id===store}); return s&&s.yesterday;
  }
  function homePage(){
    var y=yesterdayRow()||{}, w=workingAgents();
    var prof=y.profit;
    var kpis='<div class="kpis">'+
      kpi("Yesterday revenue",money(y.revenue),y.orders!=null?y.orders+" orders":"")+
      kpi("Yesterday profit",prof==null?"—":money(prof,true),prof==null?(y.revenue!=null?"not final yet":""):(!y.complete?"not final yet":(y.cogs_estimated_share>0?"COGS estimated":"final")),prof==null?"":prof<0?"bad-t":"ok-t")+
      kpi("Yesterday ROAS",x2(y.roas),y.breakeven_roas!=null?"break-even "+x2(y.breakeven_roas):"",y.roas!=null&&y.breakeven_roas!=null?(y.roas>=y.breakeven_roas?"ok-t":"bad-t"):"")+
      kpi("Agents running",w.length+" now",builtCount()+" of "+state.agents.length+" built")+'</div>';
    var map='<div class="mapbox"><svg id="map" viewBox="0 0 1100 840" role="img" aria-label="Every agent; working agents pulse, moving dots are hand-offs">'+mapSvg()+'</svg>'+
      '<div class="legend"><span><i style="border:1px solid var(--good);box-shadow:0 0 0 3px rgba(169,220,196,.15)"></i>working now (acted in the last 2 min)</span><span>moving dots = a real hand-off or a log entry</span><span><i style="background:var(--accent)"></i>built</span><span><i style="border:1px solid var(--faint)"></i>planned</span><span>click an agent to open it</span></div></div>';
    var n=needs();
    var wait='<div class="lab" style="display:flex;justify-content:space-between"><span>Waiting on you · '+n.length+'</span><a href="#/brief" style="text-transform:none;letter-spacing:0;color:var(--muted)">open Brief →</a></div>'+

  /* map geometry (same layout as the approved concept): Core + manager ring in the middle,

  var GEO=null;
  function geometry(){
    if(GEO) return GEO;
    var g={pos:{},hubs:{}}, cx=550, cy=420, r=function(n){return Math.round(n*10)/10};
    var core=state.agents.filter(function(a){return a.dept==="core"});
    core.forEach(function(a,i){ var t=-Math.PI/2+i*2*Math.PI/core.length; g.pos[a.id]={x:r(cx+92*Math.cos(t)),y:r(cy+92*Math.sin(t)),side:Math.cos(t)>=0?1:-1}; });
    g.pos.core={x:cx,y:cy};
    var depts=state.departments.filter(function(d){return d.id!=="core"});
    depts.forEach(function(d,i){
      var t=-Math.PI/2+(i+.5)*2*Math.PI/depts.length, hx=r(cx+300*Math.cos(t)), hy=r(cy+300*Math.sin(t));
      var side=Math.abs(Math.cos(t))<.2?1:Math.sign(Math.cos(t));
      g.hubs[d.id]={x:hx,y:hy,t:t,side:side}; g.pos[d.id]={x:hx,y:hy};
      var ag=state.agents.filter(function(a){return a.dept===d.id});
      ag.forEach(function(a,j){ g.pos[a.id]={x:r(hx+side*78),y:r(hy+(j-(ag.length-1)/2)*19),side:side,hub:d.id}; });
    });

  }

    var depts=state.departments.filter(function(d){return d.id!=="core"});

    });

  /* ---------------- BRIEF ---------------- */
  function mdHtml(md){
    var out=[], list=false;
    function inline(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)_([^_]+)_(?=\s|$|[.,;:)])/g,"$1<i>$2</i>"); }
    String(md||"").split("\n").forEach(function(line){
      var t=line.trim(), bullet=/^[-*•]\s+/.test(t);
      if(!bullet&&list){ out.push("</ul>"); list=false; }
      if(!t) return;
      if(bullet){ if(!list){out.push("<ul>");list=true;} out.push("<li>"+inline(t.replace(/^[-*•]\s+/,""))+"</li>"); return; }
      var h=/^(#{1,3})\s+(.*)$/.exec(t);
      if(h){ var n=h[1].length+2; out.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); return; }
      if(t.charAt(0)===">"){ out.push('<div class="warnbox">'+inline(t.replace(/^>\s*/,""))+"</div>"); return; }
      out.push("<p>"+inline(t)+"</p>");
    });
    if(list) out.push("</ul>");
    return out.join("");
  }

  /* ---------------- P&L ---------------- */

  async function loadPnl(force){
    if(!force&&pnlData&&pnlStore===store&&Date.now()-pnlAt<60000) return;
    try{
      var want=store, r=await api("/api/pnl?store="+encodeURIComponent(want));

  function addDays(day,n){ var d=new Date(day+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
  function fmtDay(day,long){ var d=new Date(day+"T12:00:00Z"); return d.toLocaleDateString(undefined,long?{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}:{month:"short",day:"numeric",timeZone:"UTC"}); }
  function breakeven(margin){ if(margin==null||!isFinite(margin)) return null; var d=margin*(1-0.119)-0.0334; return d>0?1/d:null; }
  /* Sum days the same way the server does: any unknown part makes the total unknown (rule 5). */
  function sumDays(rows){
    var keys=["revenue","orders","refunds","refunds_pending","ads","guy_fee","fees","cogs","cogs_est","profit"], o={n:rows.length};
    keys.forEach(function(k){ o[k]=rows.length&&rows.every(function(r){return r[k]!=null})?rows.reduce(function(s,r){return s+Number(r[k])},0):null; });
    var known=rows.filter(function(r){return r.profit!=null});
    o.profit_known=known.reduce(function(s,r){return s+Number(r.profit)},0); o.known_days=known.length;
    o.complete=rows.length>0&&rows.every(function(r){return r.complete});
    o.cogs_est_share=o.cogs?(o.cogs_est||0)/o.cogs:null;
    o.margin=o.revenue&&o.profit!=null?o.profit/o.revenue:null;
    o.gross_margin=o.revenue&&o.cogs!=null?(o.revenue-o.cogs)/o.revenue:null;
    o.roas=o.ads?o.revenue/o.ads:null;
    o.be=breakeven(o.gross_margin);
    o.aov=o.orders?o.revenue/o.orders:null;
    o.missing=[]; o.stale=[]; o.missing_stores=[];
    rows.forEach(function(r){ (r.missing||[]).forEach(function(m){ if(o.missing.indexOf(m)<0) o.missing.push(m) }); (r.stale||[]).forEach(function(m){ if(o.stale.indexOf(m)<0) o.stale.push(m) }); (r.missing_stores||[]).forEach(function(m){ if(o.missing_stores.indexOf(m)<0) o.missing_stores.push(m) }); });
    return o;
  }
  function periodRows(){
    var days=pnlData.days||[], sel=pnlSel.day||pnlData.today, p=pnlSel.period;

      (d.days.length?d.days.map(function(r){

  /* lHtml is built here from fixed text (+ a tag), never from data. */
  function blk(lHtml,v,s,cls){ return '<div class="blk"><div class="l">'+lHtml+'</div><div class="v '+(cls||"")+'">'+esc(v)+'</div><div class="s">'+esc(s||"")+'</div></div>'; }
  function profitWhy(s){
    if(s.missing_stores.length) return "missing a day for "+s.missing_stores.map(storeName).join(", ");

  }
  async function loadConnections(){
    try{ var r=await api("/api/admin/connections"); var j=await r.json(); if(!j.ok) throw 0;
      var g=j.google||{};
      var h=(g.connected?'<div class="ok-t">✓ Google: '+esc(g.account)+(g.missing&&g.missing.length?' <span class="warn-t">· missing: '+esc(g.missing.join(", "))+'</span>':'')+'</div>':'<div class="warn-t">· Google: '+(g.account?"saved but not verified, connect again":"not connected")+'</div>');
      h+=(j.mailboxes||[]).map(function(m){ return '<div style="margin:6px 0">'+(m.connected?'<span class="ok-t">✓</span>':'<span class="warn-t">·</span>')+' '+esc(m.name)+' <span class="meta" style="display:inline">'+esc(m.mailbox||"no inbox set up yet")+(m.mailbox?(m.connected?" · connected":" · not connected"):"")+'</span>'+(m.mailbox?' <button class="btn" data-google="'+esc(m.store)+'">'+(m.connected?"Reconnect":"Connect")+'</button>':'')+'</div>'; }).join("");
      h+='<div class="meta" style="margin-top:8px">'+Object.keys(j.secrets).map(function(n){return (j.secrets[n]?"✓ ":"· ")+esc(n)}).join(" · ")+'</div>';
      $("#outConn").innerHTML=h;
      document.querySelectorAll("#outConn button[data-google]").forEach(function(b){ b.addEventListener("click",function(){ google(b.dataset.google,b) }) });
      busyUntil=Date.now()+60000;
    }catch(e){ $("#outConn").innerHTML='<span class="meta">Couldn\'t load connections.</span>'; }
  }

  key=getKey(); route=parseRoute(); load();
})();
</script>
</body>
</html>
