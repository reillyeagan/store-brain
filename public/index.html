<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Control · Store Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Eagano dash language: near-black, steel accent, Inter, no colour noise. */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --panel:#131316; --panel2:#17171b; --border:#26262b; --soft:#1d1d21;
  --text:#e8e8ea; --muted:#8a8a93; --faint:#54545c;
  --accent:#c7d2db; --accent-dim:#5e6b76; --good:#6bbf8a; --warn:#c9a36b; --bad:#c97b7b;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1560px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.pill{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:#2b3d31}.pill.warn{color:var(--warn);border-color:#4a3d29}.pill.bad{color:var(--bad);border-color:#4a2c2c}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.tile .pill{white-space:normal}
.tile b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow-x:auto;min-width:0}
#map{display:block;width:100%;min-width:820px;height:auto}
.legend svg{display:inline-block;width:12px;height:12px}
.side{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:0;display:flex;flex-direction:column;max-height:880px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 12.5px var(--font);padding:12px 6px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pane{overflow:auto;padding:10px 12px;display:grid;gap:8px;align-content:start}
.row{border:1px solid var(--soft);border-radius:8px;padding:9px 10px;display:grid;gap:3px;background:var(--panel2)}
.row .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap}
.row.alarm{border-color:#4a2c2c}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums}
.pend{color:var(--warn)}
.bad-t{color:var(--bad)}
.msg{white-space:pre-wrap;font-size:12.5px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;margin:2px 0}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn{background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:500 12px var(--font);cursor:pointer}
.btn.primary{border-color:var(--accent-dim);color:var(--accent)}
.btn.reject{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--faint)}
.dot.fresh{background:var(--good)}.dot.stale,.dot.failing{background:var(--bad)}.dot.not_wired{background:var(--faint)}
.lbl{fill:var(--text);font:400 10.5px var(--font)}
.lbl.m{fill:var(--muted)}
.dlbl{fill:var(--text);font:600 11.5px var(--font);letter-spacing:.14em}
.edge{stroke:#2c2c32;stroke-width:1}
.edge.hot{stroke:var(--accent);stroke-width:1.8}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate form{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;display:grid;gap:12px;width:min(420px,100%)}
.gate input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font:14px var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--border)}
.legend span{display:inline-flex;align-items:center;gap:6px}
@keyframes pulse{0%{opacity:.9;r:9}100%{opacity:0;r:22}}
.ping{fill:none;stroke:var(--accent);stroke-width:1.5;animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.ping{animation:none;opacity:.6}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <div class="eyebrow">Store Brain</div>
    <h1>Mission Control</h1>
    <label for="keyIn" style="color:var(--muted);font-size:13px">Enter your Mission Control key. It stays in this browser tab only.</label>
    <input id="keyIn" type="password" autocomplete="off" required>
    <button class="btn primary" type="submit">Open</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <div class="eyebrow">Store Brain · separate from Eagano</div>
      <h1>Mission Control</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="pill" id="updated">—</span>
      <span class="pill" id="version">—</span>
    </div>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="main">
    <div class="stage">
      <svg id="map" viewBox="0 0 1200 900" role="img" aria-label="Live map of the Store Brain"></svg>
      <div class="legend">
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#54545c"/></svg>Planned</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="#c7d2db" stroke-width="1.5"/></svg>Built</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#c9a36b"/></svg>Shadow</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#c7d2db"/></svg>Live</span>
        <span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="none" stroke="#c7d2db"/></svg>Pulsing = acted in the last 2 min</span>
      </div>
    </div>
    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="activity" id="tab-activity">Activity</button>
        <button role="tab" aria-selected="false" data-tab="approvals" id="tab-approvals">Approvals</button>
        <button role="tab" aria-selected="false" data-tab="supplier" id="tab-supplier">Supplier</button>
        <button role="tab" aria-selected="false" data-tab="money" id="tab-money">Money</button>
        <button role="tab" aria-selected="false" data-tab="shipping" id="tab-shipping">Shipping</button>
        <button role="tab" aria-selected="false" data-tab="feeds" id="tab-feeds">Feeds</button>
        <button role="tab" aria-selected="false" data-tab="setup" id="tab-setup">Setup</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY_STORE="sb_mc_key";
  var key=null, state=null, tab="activity", timer=null;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  function getKey(){
    /* #key=... in the address (never ?key=), so the key is never sent to the server in a URL */
    var m=/(?:^|[#&])key=([^&]+)/.exec(location.hash), k=m?decodeURIComponent(m[1]):null;
    if(k){ try{sessionStorage.setItem(KEY_STORE,k)}catch(e){} history.replaceState(null,"",location.pathname); return k; }
    try{ return sessionStorage.getItem(KEY_STORE) }catch(e){ return null }
  }
  function showGate(msg){
    $("#app").hidden=true; $("#gate").hidden=false;
    if(msg){ $("#keyIn").setCustomValidity(msg); $("#keyIn").reportValidity(); }
  }
  $("#gateForm").addEventListener("submit",function(e){
    e.preventDefault(); key=$("#keyIn").value.trim(); $("#keyIn").setCustomValidity("");
    try{sessionStorage.setItem(KEY_STORE,key)}catch(err){}
    load();
  });

  async function load(){
    if(!key){ showGate(); return; }
    try{
      var r=await fetch("/api/state",{headers:{"x-store-brain-key":key},cache:"no-store"});
      if(r.status===401){ try{sessionStorage.removeItem(KEY_STORE)}catch(e){} key=null; showGate("That key didn't work."); return; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      state=await r.json();
      $("#gate").hidden=true; $("#app").hidden=false;
      if(!(tab==="setup"&&setupBusy)) render();
    }catch(err){
      $("#updated").textContent="Can't reach the brain: "+err.message;
      $("#updated").className="pill bad";
    }
    clearTimeout(timer); timer=setTimeout(load,15000);
  }

  /* ---------------- map ---------------- */
  var NS="http://www.w3.org/2000/svg";
  function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
  var svg=$("#map"), pos={};
  var C={x:500,y:450};
  function anc(c){return c>.25?"start":c<-.25?"end":"middle"}

  function layout(){
    pos={};
    pos["core"]={x:C.x,y:C.y,r:36};
    var mgr=state.agents.filter(function(a){return a.dept==="core"});
    mgr.forEach(function(a,i){var t=-Math.PI/2+i*2*Math.PI/mgr.length;pos[a.id]={x:C.x+Math.cos(t)*88,y:C.y+Math.sin(t)*88,r:6,ang:t}});
    var depts=state.departments.filter(function(d){return d.id!=="core"});
    var step=2*Math.PI/depts.length;
    state.services.forEach(function(s,i){var t=-Math.PI/2+(i+.5)*(2*Math.PI/state.services.length);pos[s.id]={x:C.x+Math.cos(t)*160,y:C.y+Math.sin(t)*160,r:5,ang:t,sq:true}});
    depts.forEach(function(d,i){
      var t=-Math.PI/2+i*step, x=C.x+Math.cos(t)*285, y=C.y+Math.sin(t)*285;
      pos[d.id]={x:x,y:y,r:22,ang:t};
      var subs=state.agents.filter(function(a){return a.dept===d.id}), n=subs.length, spread=Math.min(Math.PI*.95,n*.37);
      subs.forEach(function(a,j){var b=t-spread/2+(n===1?spread/2:j*spread/(n-1));pos[a.id]={x:x+Math.cos(b)*84,y:y+Math.sin(b)*84,r:6,ang:b,j:j}});
    });
    state.systems.forEach(function(s,i){pos[s.id]={x:1100,y:150+i*80,r:0,sys:true}});
  }

  function render(){
    var now=Date.now();
    $("#updated").textContent="Updated "+new Date(state.now).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    $("#updated").className="pill";
    $("#version").textContent="v"+state.version;

    // tiles
    var feeds=state.feeds, fresh=feeds.filter(function(f){return f.state==="fresh"}).length;
    var bad=feeds.filter(function(f){return f.state==="stale"||f.state==="failing"}).length;
    var unwired=feeds.filter(function(f){return f.state==="not_wired"}).length;
    var dayStartMs=Date.parse(state.todayStart);
    var today=state.events.filter(function(e){return Date.parse(e.at)>=dayStartMs}).length;
    var live=state.agents.filter(function(a){return a.status==="live"}).length;
    $("#tiles").innerHTML=
      tile("Stores live",state.stores.filter(function(s){return s.live}).length+" / "+state.stores.length,"")+
      tile("Feeds fresh",fresh+" / "+feeds.length, bad?bad+" stale or failing":unwired?unwired+" not wired yet":"all fresh", bad?"bad":"")+
      tile("Waiting on you",state.approvals.length,"approvals","")+
      (function(sh){ sh=sh||{flags:[]}; var q=sh.quota;
        return tile("Parcels flagged",sh.flags.length, sh.quotaLow?"17TRACK quota low: "+q.remain+" left":!sh.wired?"17TRACK not wired":q&&q.remain!=null?q.remain+" registrations left":"", sh.quotaLow?"warn":""); })(state.shipping)+
      tile("Actions today",today,"events","")+
      tile("Agents live",live+" / "+state.agents.length,"rest built or planned","")+
      tile("AI cost today","$"+Number(state.aiCostToday||0).toFixed(2),"","");

    // map
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    layout();
    var gE=el("g",{}), gN=el("g",{});
    el("circle",{cx:C.x,cy:C.y,r:160,fill:"none",stroke:"#5e6b76","stroke-opacity":.5,"stroke-dasharray":"2 6"},gE);
    var recent=state.events.filter(function(e){return now-Date.parse(e.at)<120000});
    var active={}, hotLinks=[];
    recent.forEach(function(e){active[e.actor]=1; if(e.target) {active[e.target]=1; hotLinks.push([e.actor,e.target]);}});
    function line(a,b,hot){ if(!pos[a]||!pos[b])return; el("line",{x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y,class:"edge"+(hot?" hot":"")},gE); }
    state.agents.forEach(function(a){ line(a.dept==="core"?"core":a.dept,a.id,false) });
    state.departments.forEach(function(d){ if(d.id!=="core") line("core",d.id,false) });
    hotLinks.forEach(function(l){ line(l[0],l[1],true) });

    // core
    el("circle",{cx:C.x,cy:C.y,r:36,fill:"#e8e8ea"},gN);
    var ct=el("text",{x:C.x,y:C.y+4,"text-anchor":"middle",class:"dlbl"},gN); ct.textContent="CORE"; ct.style.fill="#0b0b0d";
    // departments
    state.departments.forEach(function(d){ if(d.id==="core")return; var p=pos[d.id];
      el("circle",{cx:p.x,cy:p.y,r:22,fill:"#17171b",stroke:"#5e6b76"},gN);
      var ca=Math.cos(p.ang),sa=Math.sin(p.ang);
      var t=el("text",{x:p.x-ca*32,y:p.y-sa*32+(Math.abs(ca)<.3?(sa>0?-4:14):4),"text-anchor":Math.abs(ca)<.3?"middle":(ca<0?"start":"end"),class:"dlbl"},gN); t.textContent=d.short.toUpperCase();
    });
    // agents
    state.agents.forEach(function(a){ var p=pos[a.id];
      var st=a.status, fill=st==="live"?"#c7d2db":st==="shadow"?"#c9a36b":"#0b0b0d", stroke=st==="planned"?"#54545c":"#c7d2db";
      if(active[a.id]) el("circle",{cx:p.x,cy:p.y,r:9,class:"ping"},gN);
      var c=el("circle",{cx:p.x,cy:p.y,r:6,fill:fill,stroke:stroke,"stroke-width":st==="built"?1.6:1},gN);
      var tt=el("title",{},c); tt.textContent=a.name+" · "+(a.kind==="ai"?"AI":"code")+" · "+a.level+" · "+st;
      var c2=Math.cos(p.ang), s2=Math.sin(p.ang), vert=Math.abs(c2)<.45 && a.dept!=="core";
      var lx=p.x+c2*11, ly=p.y+s2*11+4+(vert&&p.j%2?13*Math.sign(s2):0);
      var t=el("text",{x:lx,y:ly,"text-anchor":vert?(c2>=0?"start":"end"):anc(c2),class:"lbl"+(st==="planned"?" m":"")},gN); t.textContent=a.name;
    });
    // services
    state.services.forEach(function(s){ var p=pos[s.id];
      if(active[s.id]) el("circle",{cx:p.x,cy:p.y,r:9,class:"ping"},gN);
      el("rect",{x:p.x-5,y:p.y-5,width:10,height:10,rx:2,fill:"#0b0b0d",stroke:s.status==="planned"?"#54545c":"#c7d2db","stroke-width":1.4},gN);
      var t=el("text",{x:p.x+Math.cos(p.ang)*13,y:p.y+Math.sin(p.ang)*13+4,"text-anchor":anc(Math.cos(p.ang)),class:"lbl m","font-family":"ui-monospace,Menlo,monospace","font-size":"9.5"},gN); t.textContent=s.name;
    });
    // systems
    var h=el("text",{x:1100,y:118,"text-anchor":"middle",class:"lbl m"},gN); h.textContent="SYSTEMS";
    state.systems.forEach(function(s){ var p=pos[s.id];
      el("rect",{x:p.x-70,y:p.y-15,width:140,height:30,rx:6,fill:"#131316",stroke:active[s.id]?"#c7d2db":"#26262b"},gN);
      var t=el("text",{x:p.x,y:p.y+4,"text-anchor":"middle",class:"lbl"},gN); t.textContent=s.name;
    });

    renderPane();
  }
  function tile(label,value,sub,cls){
    return '<div class="tile"><span class="eyebrow">'+esc(label)+'</span><b>'+esc(value)+'</b>'+(sub?'<span class="pill '+(cls||"")+'" style="justify-self:start">'+esc(sub)+'</span>':"")+'</div>';
  }

  /* ---------------- side panel ---------------- */
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){ tab=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")}); renderPane(); });
  });
  function agentName(id){ var a=state.agents.find(function(x){return x.id===id}) || state.services.find(function(x){return x.id===id}) || state.systems.find(function(x){return x.id===id}); return a?a.name:id; }
  function ago(iso){ var m=Math.round((Date.now()-Date.parse(iso))/60000); if(m<1)return "just now"; if(m<60)return m+" min ago"; var h=Math.round(m/60); return h<48?h+" h ago":Math.round(h/24)+" d ago"; }

  function renderPane(){
    var p=$("#pane");
    if(tab==="activity"){
      if(!state.events.length){ p.innerHTML='<div class="empty">No activity yet. Events appear here the moment any agent acts.</div>'; return; }
      p.innerHTML=state.events.slice(0,120).map(function(e){
        var alarm=/alarm|error|failed|mismatch/i.test(e.kind);
        return '<div class="row'+(alarm?" alarm":"")+'"><span>'+esc(e.summary)+'</span><span class="meta"><span>'+esc(agentName(e.actor))+'</span>'+(e.target?'<span>→ '+esc(agentName(e.target))+'</span>':"")+(e.store?'<span>'+esc(e.store.toUpperCase())+'</span>':"")+'<span>'+esc(ago(e.at))+'</span></span></div>';
      }).join("");
    } else if(tab==="approvals"){
      if(!state.approvals.length){ p.innerHTML='<div class="empty">Nothing is waiting on you.</div>'; return; }
      p.innerHTML=state.approvals.map(function(a){
        return '<div class="row" id="approval-'+a.id+'"><b>'+esc(a.title)+'</b><span class="meta"><span>'+esc(agentName(a.requested_by))+'</span>'+(a.store?'<span>'+esc(a.store.toUpperCase())+'</span>':"")+'<span>'+esc(ago(a.created_at))+'</span></span>'+
          a.options.map(function(o){return o.detail?'<span style="color:var(--muted);font-size:12.5px">'+esc(o.label)+': '+esc(o.detail)+'</span>':""}).join("")+
          '<div class="btns">'+a.options.map(function(o){return '<button class="btn primary" data-ap="'+a.id+'" data-choice="'+esc(o.id)+'">'+esc(o.label)+'</button>'}).join("")+
          '<button class="btn reject" data-ap="'+a.id+'" data-choice="reject">Reject</button></div></div>';
      }).join("");
      p.querySelectorAll("button[data-ap]").forEach(function(b){ b.addEventListener("click",function(){ decideApproval(b.dataset.ap,b.dataset.choice,b) }) });
    } else if(tab==="supplier"){
      var sup=state.supplier||{kfbMessages:[],expressToday:[],mode:"shadow"};
      var html='<div class="sub">Express orders today</div>';
      html+=sup.expressToday.length?sup.expressToday.map(function(o){
        return '<div class="row"><span>'+esc(o.store_name)+' '+esc(o.name)+'</span><span class="meta"><span>'+esc(o.shipping_title||"express")+'</span><span>'+(o.asked_in?"asked KFB (message "+esc(o.asked_in)+")":"not asked yet")+'</span><span>'+esc(ago(o.created_at))+'</span></span></div>';
      }).join(""):'<div class="empty">No express orders today.</div>';
      html+='<div class="sub">KFB messages · '+(sup.mode==="live"?"live (sent to your phone)":"shadow (drafts only, not sent to your phone)")+'</div>';
      html+=sup.kfbMessages.length?sup.kfbMessages.map(function(m){
        var st=m.status==="sent"?"sent "+ago(m.sent_at):m.status;
        return '<div class="row" id="kfb-'+m.id+'"><div class="msg">'+esc(m.body)+'</div><span class="meta"><span>'+esc(m.local_day)+'</span><span>'+esc(m.mode)+'</span><span>'+esc(st)+'</span><span>'+esc(m.item_count)+' order'+(m.item_count===1?"":"s")+'</span></span>'+
          '<div class="btns"><button class="btn" data-copy="'+m.id+'">Copy</button>'+(m.status!=="sent"?'<button class="btn primary" data-sent="'+m.id+'">Mark sent</button>':"")+'</div></div>';
      }).join(""):'<div class="empty">No KFB messages yet. The brain checks once a day after 6:45 pm Eastern.</div>';
      p.innerHTML=html;
      p.querySelectorAll("button[data-copy]").forEach(function(b){ b.addEventListener("click",function(){
        var m=sup.kfbMessages.find(function(x){return String(x.id)===b.dataset.copy});
        if(m&&navigator.clipboard) navigator.clipboard.writeText(m.body).then(function(){b.textContent="Copied"},function(){b.textContent="Copy failed"});
      }) });
      p.querySelectorAll("button[data-sent]").forEach(function(b){ b.addEventListener("click",function(){ markSent(b.dataset.sent,b) }) });
    } else if(tab==="money"){
      p.innerHTML=renderMoney(state.money||{stores:[]});
    } else if(tab==="shipping"){
      var sh=state.shipping||{wired:false,counts:{},labels:{},flags:[],registerErrors:[]};
      var html2='';
      if(!sh.wired) html2+='<div class="row alarm"><span>17TRACK is not wired: add TRACKING_API_KEY in Cloudflare (Setup bat 9). Tracking numbers are still collected from Shopify.</span></div>';
      var q=sh.quota;
      html2+='<div class="row'+(sh.quotaLow?" alarm":"")+'"><span>'+(q&&q.remain!=null?'<b>'+esc(q.remain)+'</b> tracking registrations left'+(q.total!=null?' of '+esc(q.total):''):'Quota not read yet')+'</span><span class="meta">'+
        (sh.quotaLow?'<span style="color:var(--warn)">low: new parcels stop being tracked at 0</span>':'')+
        '<span>last 17TRACK sync '+(sh.lastSync?esc(ago(sh.lastSync)):'never')+'</span><span>Shopify numbers read '+(sh.lastCollect?esc(ago(sh.lastCollect)):'never')+'</span></span></div>';
      html2+='<div class="sub">Parcels · last 60 days</div>';
      var order=["not_registered","not_checked","awaiting_pickup","in_transit","out_for_delivery","pickup_ready","failed_attempt","exception","expired","unknown","delivered"];
      var keys=Object.keys(sh.counts||{}).sort(function(a,b){return order.indexOf(a)-order.indexOf(b)});
      html2+=keys.length?'<div class="row">'+keys.map(function(k){
        var warn=k==="failed_attempt"||k==="pickup_ready"||k==="exception";
        return '<span style="display:flex;justify-content:space-between"><span'+(warn?' style="color:var(--warn)"':'')+'>'+esc((sh.labels&&sh.labels[k])||k)+'</span><b style="font-variant-numeric:tabular-nums">'+esc(sh.counts[k])+'</b></span>';
      }).join("")+'</div>':'<div class="empty">No parcels yet. Tracking numbers appear after KFB ships an order.</div>';
      html2+='<div class="sub">Needs attention</div>';
      html2+=sh.flags.length?sh.flags.map(function(f){
        var hot=f.kind==="day20"||f.kind==="failed_delivery"||f.kind==="pickup_ready";
        return '<div class="row'+(hot?" alarm":"")+'"><b>'+esc(f.store_name)+' '+esc(f.order_name)+' · '+esc(f.label)+'</b><span style="color:var(--muted);font-size:12.5px">'+esc(f.detail)+'</span><span class="meta">'+
          (f.tracking_number?'<span>'+esc(f.tracking_number)+'</span>':'')+(f.last_event_text?'<span>'+esc(String(f.last_event_text).slice(0,80))+'</span>':'')+
          (f.approval_id?'<span>approval '+esc(f.approval_id)+(f.approval_status?' · '+esc(f.approval_status):'')+'</span>':'')+'<span>flagged '+esc(ago(f.raised_at))+'</span></span></div>';
      }).join(""):'<div class="empty">Nothing stuck, failed or late.</div>';
      if(sh.registerErrors&&sh.registerErrors.length){
        html2+='<div class="sub">17TRACK couldn\'t take these numbers</div>'+sh.registerErrors.map(function(r){
          return '<div class="row"><span>'+esc(r.store_name)+' '+esc(r.order_name)+' · '+esc(r.tracking_number)+'</span><span class="meta"><span>'+esc(r.register_error)+'</span></span></div>';
        }).join("");
      }
      p.innerHTML=html2;
    } else if(tab==="setup"){
      p.innerHTML='<div class="row"><b>1 · Check the store connections</b><span style="color:var(--muted);font-size:12.5px">Logs in to each store with its own app, confirms it is the right shop, and lists the access Shopify granted. Read-only.</span><div class="btns"><button class="btn primary" id="btnCheck">Check stores</button></div><div id="outCheck"></div></div>'+
        '<div class="row"><b>2 · Connect order + refund notifications</b><span style="color:var(--muted);font-size:12.5px">Tells each store to notify the brain the moment an order or refund happens. Checked against Shopify afterwards.</span><div class="btns"><button class="btn primary" id="btnHooks">Connect notifications</button></div><div id="outHooks"></div></div>'+
        '<div class="row"><b>3 · Test your phone</b><span style="color:var(--muted);font-size:12.5px">Sends one plain message through Pushover. If it shows up on your phone, approvals and alerts will reach you.</span><div class="btns"><button class="btn primary" id="btnPhone">Send test notification</button></div><div id="outPhone"></div></div>'+
        '<div class="row"><b>4 · Connect Google</b><span style="color:var(--muted);font-size:12.5px">One sign-in with reillyworking26@gmail.com gives the brain Gmail, Google Ads (watch only), Merchant Center and Sheets. Google will call the app unverified: click Advanced, then Go to Store Brain, and tick every box.</span><div class="btns"><button class="btn primary" id="btnGoogle">Connect Google</button></div><div id="outGoogle"></div></div>'+
        '<div class="row"><b>5 · Store inboxes</b><span style="color:var(--muted);font-size:12.5px">Each store\'s own customer-service Gmail, connected separately (Gmail only). Sign in as that inbox when Google asks.</span><div id="outBoxes"><span class="meta">Checking…</span></div></div>'+
        '<div class="row"><b>Connections</b><span style="color:var(--muted);font-size:12.5px">Which keys are in Cloudflare (names only, values are never shown).</span><div id="outConn"><span class="meta">Checking…</span></div></div>';
      $("#btnGoogle").addEventListener("click",async function(){
        var b=$("#btnGoogle"); b.disabled=true; $("#outGoogle").innerHTML='<span class="meta">Opening Google…</span>';
        try{ var r=await fetch("/api/admin/google/start",{method:"POST",headers:{"x-store-brain-key":key}}); var j=await r.json();
          if(j.ok&&j.url){ window.location.assign(j.url); return; }
          $("#outGoogle").innerHTML='<span style="color:var(--bad)">✗ '+esc(j.error||("HTTP "+r.status))+'</span>';
        }catch(e){ $("#outGoogle").innerHTML='<span style="color:var(--bad)">Couldn\'t reach the brain.</span>'; }
        b.disabled=false;
      });
      (async function(){
        try{ var r=await fetch("/api/admin/connections",{headers:{"x-store-brain-key":key}}); var j=await r.json(); if(!j.ok) throw 0;
          var rows=Object.keys(j.secrets).map(function(n){ return '<div>'+(j.secrets[n]?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--faint)">·</span>')+' <span class="meta">'+esc(n)+'</span></div>'; }).join("");
          var g=j.google||{}; var gl=(g.connected===false&&g.account)?'<div><span style="color:var(--warn)">!</span> Google: saved but not verified — click Connect Google again</div>':g.connected?('<div><span style="color:var(--good)">✓</span> Google: '+esc(g.account)+' <span class="meta">'+esc((g.granted||[]).join(", "))+(g.missing&&g.missing.length?' · missing: '+esc(g.missing.join(", ")):'')+(g.verified_at?' · checked '+esc(ago(g.verified_at)):'')+'</span></div>'):'<div><span style="color:var(--faint)">·</span> Google: not connected</div>';
          $("#outConn").innerHTML=gl+rows;
          var bx=(j.mailboxes||[]).filter(function(m){return m.mailbox;});
          $("#outBoxes").innerHTML=(bx.length?bx.map(function(m){ return '<div style="margin:6px 0">'+(m.connected?'<span style="color:var(--good)">✓</span>':(m.account?'<span style="color:var(--warn)">!</span>':'<span style="color:var(--faint)">·</span>'))+' '+esc(m.name)+' <span class="meta">'+esc(m.mailbox)+(m.connected&&m.verified_at?' · checked '+esc(ago(m.verified_at)):(m.account?' · saved but not verified':' · not connected'))+'</span> <button class="btn" data-box="'+esc(m.store)+'">'+(m.connected?'Reconnect':'Connect')+'</button></div>'; }).join(""):'<span class="meta">No store inboxes set up yet.</span>')+
            (j.mailboxes||[]).filter(function(m){return !m.mailbox;}).map(function(m){ return '<div class="meta">'+esc(m.name)+': no inbox set up yet</div>'; }).join("");
          document.querySelectorAll("button[data-box]").forEach(function(b){ b.addEventListener("click",async function(){
            b.disabled=true;
            try{ var r2=await fetch("/api/admin/google/start",{method:"POST",headers:{"x-store-brain-key":key,"content-type":"application/json"},body:JSON.stringify({target:b.dataset.box})}); var j2=await r2.json();
              if(j2.ok&&j2.url){ window.location.assign(j2.url); return; } b.insertAdjacentHTML("afterend",' <span style="color:var(--bad)">'+esc(j2.error||"failed")+'</span>');
            }catch(e){} b.disabled=false; }); });
        }catch(e){ $("#outConn").innerHTML='<span class="meta">Couldn\'t load connections.</span>'; }
      })();
      $("#btnPhone").addEventListener("click",function(){ runSetup("/api/admin/test-notification",$("#btnPhone"),$("#outPhone"),function(r){
        return r.sent?'<span style="color:var(--good)">✓ Sent</span> <span class="meta">check your phone. If nothing arrives within a minute, the user key belongs to a different Pushover account.</span>':'<span style="color:var(--bad)">✗ '+esc(r.reason||"not sent")+'</span>'; }) });
      $("#btnCheck").addEventListener("click",function(){ runSetup("/api/admin/check-stores",$("#btnCheck"),$("#outCheck"),function(r){
        return r.ok?'<span style="color:var(--good)">✓ '+esc(r.name)+'</span> <span class="meta">'+esc(r.domain)+(r.missing&&r.missing.length?' · missing: '+esc(r.missing.join(", ")):' · all access granted')+'</span>':'<span style="color:var(--bad)">✗ '+esc(r.name)+': '+esc(r.error)+'</span>'; }) });
      $("#btnHooks").addEventListener("click",function(){ runSetup("/api/admin/webhooks",$("#btnHooks"),$("#outHooks"),function(r){
        return r.verified?'<span style="color:var(--good)">✓ '+esc(r.name)+'</span> <span class="meta">connected and verified</span>':'<span style="color:var(--bad)">✗ '+esc(r.name)+': '+esc((r.errors||[]).join(" | ")||"not verified")+'</span>'; }) });
    } else {
      p.innerHTML=state.feeds.map(function(f){
        var label={fresh:"Fresh",stale:"Stale",failing:"Failing",not_wired:"Not wired yet"}[f.state]||f.state;
        return '<div class="row'+(f.state==="stale"||f.state==="failing"?" alarm":"")+'"><span><span class="dot '+esc(f.state)+'"></span>'+esc(f.label)+'</span><span class="meta"><span>'+esc(label)+'</span>'+(f.last_ok_at?'<span>last delivered '+esc(ago(f.last_ok_at))+'</span>':"")+'<span>limit '+esc(f.max_age_min)+' min</span>'+(f.last_error?'<span>'+esc(f.last_error)+'</span>':"")+'</span></div>';
      }).join("");
    }
  }
  /* ---------------- money ---------------- */
  var FEED_LBL={fresh:"Fresh",stale:"Stale",failing:"Failing",not_wired:"Not wired yet"};
  function amt(n,cur){ return n==null?"—":Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+(cur?" "+cur:""); }
  function feedLine(name,f){
    f=f||{state:"not_wired"};
    return '<span class="meta"><span><span class="dot '+esc(f.state)+'"></span>'+esc(name)+': '+esc(FEED_LBL[f.state]||f.state)+'</span>'+(f.last_ok_at?'<span>last delivered '+esc(ago(f.last_ok_at))+'</span>':"")+(f.last_error&&f.state!=="fresh"?'<span class="bad-t">'+esc(f.last_error)+'</span>':"")+'</span>';
  }
  function kv(k,v,cls){ return '<div class="kv"><span>'+esc(k)+'</span><b'+(cls?' class="'+cls+'"':"")+'>'+v+'</b></div>'; }
  function renderMoney(m){
    if(!m.stores.length) return '<div class="empty">No live stores.</div>';
    return m.stores.map(function(s){
      var h='<div class="sub">'+esc(s.name)+'</div>';
      // Ads spend
      var a=s.ads, ah='<div class="row'+(s.adsFeed.state==="stale"||s.adsFeed.state==="failing"?" alarm":"")+'"><b>Google Ads spend</b>';
      if(!a){ ah+='<span style="color:var(--muted);font-size:12.5px">No spend data yet (shown as absent, never as zero).</span>'; }
      else{
        ah+=kv("Yesterday"+(a.yesterday?" · "+a.yesterday.day:""),a.yesterday?esc(amt(a.yesterday.cost,a.currency))+' <span class="meta">· '+esc(a.yesterday.clicks)+' clicks · conv. '+esc(amt(a.yesterday.conv_value))+'</span>':"—")+
            kv("Last 7 days"+(a.last7?" · "+a.last7.from.slice(5)+" to "+a.last7.to.slice(5):""),a.last7?esc(amt(a.last7.cost,a.currency))+' <span class="meta">· '+esc(a.last7.clicks)+' clicks · conv. '+esc(amt(a.last7.conv_value))+'</span>':"—")+
            kv("Today so far (partial)",a.today?esc(amt(a.today.cost,a.currency)):"—")+
            '<span class="meta"><span>account time '+esc(a.account_tz||"?")+'</span></span>';
      }
      ah+=feedLine("Ads feed",s.adsFeed)+'</div>';
      // Shopify balance + payouts
      var ph='<div class="row'+(s.payoutsFeed.state==="stale"||s.payoutsFeed.state==="failing"?" alarm":"")+'"><b>Shopify Payments</b>';
      ph+=kv("Balance",s.balance?esc(amt(s.balance.amount,s.balance.currency))+' <span class="meta">· as of '+esc(ago(s.balance.as_of))+'</span>':"—");
      ph+=s.payouts.length?s.payouts.map(function(p){
        var chk=p.check_result==="mismatch"?'<span class="bad-t">doesn\'t add up</span>':p.check_result==="match"?'adds up':p.check_result==="unverified"?'not checked yet':'';
        var st=p.status==="PAID"?"paid":p.status==="SCHEDULED"?'<span class="pend">scheduled</span>':'<span class="bad-t">'+esc(String(p.status||"").toLowerCase())+'</span>';
        return kv(String(p.issued_at||"").slice(0,10),esc(amt(p.net,p.currency))+' <span class="meta">· '+st+(chk?' · '+chk:"")+'</span>');
      }).join(""):'<span style="color:var(--muted);font-size:12.5px">No payouts recorded yet.</span>';
      ph+=feedLine("Payouts feed",s.payoutsFeed)+'</div>';
      // Refunds by processed day
      var r=s.refunds, rh='<div class="row"><b>Refunds by processed day</b>';
      rh+=r.byDay.length?r.byDay.map(function(d){
        return kv(d.day,esc(d.n)+' · '+esc(amt(d.amount))+(d.pending_n?' <span class="pend">('+esc(d.pending_n)+' pending, '+esc(amt(d.pending_amount))+')</span>':""));
      }).join(""):'<span style="color:var(--muted);font-size:12.5px">No refunds processed '+esc(r.from)+' to '+esc(r.to)+'.</span>';
      if(r.pending.length){
        rh+='<span class="pend" style="font-size:12.5px;margin-top:4px">PENDING — money not yet back with the customer:</span>'+r.pending.map(function(p){
          return kv(p.local_day||"?",'<span class="pend">'+esc(amt(p.amount))+' · '+esc(p.status)+'</span>');
        }).join("");
      }
      rh+='</div>';
      return h+ah+ph+rh;
    }).join("")+((m.jobs||[]).length?'<div class="sub">Last runs</div><div class="row">'+m.jobs.map(function(j){ return kv(j.job,esc(ago(j.last_run_at))+(j.last_result&&j.last_result!=="ok"?' <span class="bad-t">'+esc(j.last_result)+'</span>':"")); }).join("")+'</div>':"");
  }

  var setupBusy=false;
  async function runSetup(path,btn,out,line){
    setupBusy=true; btn.disabled=true; out.innerHTML='<span class="meta">Working…</span>';
    try{
      var r=await fetch(path,{method:"POST",headers:{"x-store-brain-key":key}});
      var b=await r.json();
      out.innerHTML=b.ok?b.results.map(function(x){return '<div>'+line(x)+'</div>'}).join(""):'<span style="color:var(--bad)">'+esc(b.error||("HTTP "+r.status))+'</span>';
    }catch(e){ out.innerHTML='<span style="color:var(--bad)">Couldn\'t reach the brain.</span>'; }
    btn.disabled=false; setTimeout(function(){setupBusy=false},20000);
  }
  async function markSent(id,btn){
    var row=btn.closest(".row"); btn.disabled=true;
    try{
      var r=await fetch("/api/kfb/"+id+"/sent",{method:"POST",headers:{"x-store-brain-key":key}});
      var b=await r.json();
      row.insertAdjacentHTML("beforeend",'<span class="meta" style="color:'+(b.ok?"var(--good)":"var(--bad)")+'">'+(b.ok?"Recorded as sent":"Not recorded: "+esc(b.error))+'</span>');
    }catch(e){ btn.disabled=false; row.insertAdjacentHTML("beforeend",'<span class="meta" style="color:var(--bad)">Couldn\'t reach the brain. Nothing was recorded.</span>'); }
    setTimeout(load,800);
  }
  async function decideApproval(id,choice,btn){
    var row=btn.closest(".row"); row.querySelectorAll("button").forEach(function(x){x.disabled=true});
    try{
      var r=await fetch("/api/approvals/"+id+"/decide",{method:"POST",headers:{"x-store-brain-key":key,"content-type":"application/json"},body:JSON.stringify({choice:choice})});
      var b=await r.json();
      row.insertAdjacentHTML("beforeend",'<span class="meta" style="color:'+(b.ok?"var(--good)":"var(--bad)")+'">'+(b.ok?(b.status==="approved"?"Approved":"Rejected"):"Not recorded: "+esc(b.error))+'</span>');
    }catch(e){ row.insertAdjacentHTML("beforeend",'<span class="meta" style="color:var(--bad)">Couldn\'t reach the brain. Nothing was recorded.</span>'); }
    setTimeout(load,800);
  }

  key=getKey(); load();
})();
</script>
</body>
</html>
