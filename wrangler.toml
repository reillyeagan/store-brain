# Store Brain — Cloudflare Worker config.
# No secrets live in this file. Secrets are added by Reilly in the Cloudflare
# dashboard (Workers & Pages → store-brain → Settings → Variables and Secrets)
# or with `wrangler secret put NAME`. See docs/setup/deploy.md.

name = "store-brain"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep variables added in the Cloudflare dashboard when deploying. Only variables this file does
# NOT list are kept: a variable listed in [vars] is written back to its value here on every deploy
# (see the go-live switches at the bottom).
keep_vars = true

# Background checks. Every 15 minutes: freshness sentinel + reconciliation pulls.
# 05:00 UTC daily (~midnight-1am Eastern): day close. Exact close logic lives in code.
[triggers]
crons = ["*/15 * * * *", "0 5 * * *", "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"]

# The ledger. Create it once with: wrangler d1 create store-brain-ledger
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "store-brain-ledger"
database_id = "f12ed783-ba0b-445b-93c6-44cbbe268184"
migrations_dir = "migrations"

# Backup Vault. Create once with: wrangler r2 bucket create store-brain-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "store-brain-backups"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
# Merchant Center account ids (identifiers, not secrets), from Reilly 2026-10-14.
GMC_MERCHANT_ID_HC = "5813782710"
GMC_MERCHANT_ID_AUB = "5821098936"
GMC_MERCHANT_ID_MAR = "5849183740"
TIMEZONE = "America/New_York"
# Where the brain lives, for links in phone notifications sent from crons.
PUBLIC_BASE_URL = "https://store-brain.reillyworking26.workers.dev"
# The only Google account allowed to connect (Gmail, Ads, Merchant Center, Sheets).
GOOGLE_ACCOUNT = "reillyworking26@gmail.com"
# Google Ads API version for the spend puller. Google releases a new major version
# roughly every quarter and sunsets each one about a year later (v25: released
# 2026-07-22, sunset Aug 2027). When the brain reports "version ... is not supported",
# bump this to a current version from Google's sunset-dates page and redeploy.
GOOGLE_ADS_API_VERSION = "v25"
# Claude model for the 8:00 morning brief (Claude API model id). claude-sonnet-5-5 was the
# newest Sonnet on 2026-10-11 ($2 / $10 per million tokens). Change it here and redeploy.
BRIEF_MODEL = "claude-sonnet-5-5"
# P&L Sheets agent: writes blank input cells of the Google Sheets P&L workbooks (Reilly asked
# for it on 2026-10-14, so it is ON when unset). To stop every write, uncomment this and redeploy:
# SHEETS_WRITE = "0"
# Shopify app Client IDs are identifiers, not passwords, so they live here where a
# deploy can never wipe them. The matching Client SECRETS stay Cloudflare secrets.
SB_HC_CLIENT_ID = "91f62305f583acc7ac4dcaf6641590c1"
SB_AUB_CLIENT_ID = "7664f4cf5ed9ec191539f10c9a09335f"
SB_MAR_CLIENT_ID = "d2f3cee30759ff7d4d5f12058bce3373"
# Phone notifications go through Pushover. Its keys are secrets
# (PUSHOVER_APP_TOKEN, PUSHOVER_USER_KEY) that Reilly adds himself.

# ---------------------------------------------------------------------------------------------
# GO-LIVE SWITCHES. Reilly, 2026-10-14 20:46 New York (decision core.go_live): "i want to move
# EVERYTHING in the brain to live so its all working - can we do that". "1" = live, anything
# else = shadow (logged / shown on Mission Control only). Read in one place: src/config/live.js.
# Live never means: a Shopify write (read-only), an email SENT to a customer (drafts only, decision
# cs.sending), a message sent to KFB (copy-paste Reilly sends), or a change in Google Ads (watch only).
#
# HOW TO TURN ONE OFF: Cloudflare dashboard -> Workers & Pages -> store-brain -> Settings ->
# Variables and Secrets -> set it to "0" -> Deploy. It takes effect on the next run.
# keep_vars = true (top of this file) only KEEPS dashboard variables that this file does NOT list.
# These six ARE listed, so the next `wrangler deploy` writes "1" back over a dashboard "0".
# To keep a switch off across deploys, also change it to "0" here (or ask Claude to).

# Watching and reporting agents (Core, Media, Catalog, Risk, P&L, Fulfillment) are labelled live.
# "0" puts those labels back to shadow; it does not stop the agents (AGENTS_OFF does that).
GO_LIVE = "1"
# The 8:00 morning brief also goes to Reilly's phone (Pushover). "0" = Mission Control only.
BRIEF_PHONE_LIVE = "1"
# The evening KFB copy-paste message goes to Reilly's phone; he sends it to KFB himself.
# "0" = drafted on Mission Control only.
SUPPLIER_MESSAGES_LIVE = "1"
# One 9:00 phone reminder when no KFB import landed today. "0" = logged only.
KFB_REMINDER_LIVE = "1"
# Customer replies are saved as Gmail DRAFTS in the store inbox, for Reilly to review and click
# send. Nothing is ever sent (decision cs.sending). "0" = drafts stay on the CS page only.
CS_DRAFTS_LIVE = "1"
# Urgent phone alerts (chargeback evidence due within 48 h, spend alarm, HIGH fraud, an incident
# that needs Reilly, Store Guard / store timezone stop): at most 6 a day, one per item, no names
# or emails. "0" = logged only (phone.alert_shadow events).
PHONE_ALERTS_LIVE = "1"
