# Store Brain — Cloudflare Worker config.
# No secrets live in this file. Secrets are added by Reilly in the Cloudflare
# dashboard (Workers & Pages → store-brain → Settings → Variables and Secrets)
# or with `wrangler secret put NAME`. See docs/setup/deploy.md.

name = "store-brain"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep variables added in the Cloudflare dashboard when deploying.
keep_vars = true

# Background checks. Every 15 minutes: freshness sentinel + reconciliation pulls.
# 05:00 UTC daily (~midnight-1am Eastern): day close. Exact close logic lives in code.
[triggers]
crons = ["*/15 * * * *", "0 5 * * *", "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"]

# The ledger. Create it once with: wrangler d1 create store-brain-ledger
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "store-brain-ledger"
database_id = "f12ed783-ba0b-445b-93c6-44cbbe268184"
migrations_dir = "migrations"

# Backup Vault. Create once with: wrangler r2 bucket create store-brain-backups
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "store-brain-backups"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
TIMEZONE = "America/New_York"
# Where the brain lives, for links in phone notifications sent from crons.
PUBLIC_BASE_URL = "https://store-brain.reillyworking26.workers.dev"
# The only Google account allowed to connect (Gmail, Ads, Merchant Center, Sheets).
GOOGLE_ACCOUNT = "reillyworking26@gmail.com"
# Google Ads API version for the spend puller. Google releases a new major version
# roughly every quarter and sunsets each one about a year later (v25: released
# 2026-07-22, sunset Aug 2027). When the brain reports "version ... is not supported",
# bump this to a current version from Google's sunset-dates page and redeploy.
GOOGLE_ADS_API_VERSION = "v25"
# Claude model for the 8:00 morning brief (Claude API model id). claude-sonnet-5-5 was the
# newest Sonnet on 2026-10-11 ($2 / $10 per million tokens). Change it here and redeploy.
# BRIEF_PHONE_LIVE is NOT set here: the brief stays shadow (Mission Control only) until
# Reilly sets BRIEF_PHONE_LIVE = "1" in the Cloudflare dashboard.
BRIEF_MODEL = "claude-sonnet-5-5"
# P&L Sheets agent: writes blank input cells of the Google Sheets P&L workbooks (Reilly asked
# for it on 2026-10-14, so it is ON when unset). To stop every write, uncomment this and redeploy:
# SHEETS_WRITE = "0"
# Shopify app Client IDs are identifiers, not passwords, so they live here where a
# deploy can never wipe them. The matching Client SECRETS stay Cloudflare secrets.
SB_HC_CLIENT_ID = "91f62305f583acc7ac4dcaf6641590c1"
SB_AUB_CLIENT_ID = "7664f4cf5ed9ec191539f10c9a09335f"
SB_MAR_CLIENT_ID = "d2f3cee30759ff7d4d5f12058bce3373"
# Phone notifications go through Pushover. Its keys are secrets
# (PUSHOVER_APP_TOKEN, PUSHOVER_USER_KEY) that Reilly adds himself.
